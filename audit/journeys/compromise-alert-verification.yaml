journey_id: IDN-271
slug: compromise-alert-verification
status: audited

story:
  trigger: "A compromise incident is opened against an account and its affected scope has been determined."
  entity: "The account plus this security incident and the scope it affects."
  objective: "Tell the account owner, at every verified destination the signal does not implicate, what was seen and what was restricted, and let their answer resolve it - cleared, or into secure recovery."
  success: "The owner answers and the signal is cleared, with any restriction lifted and that lift stated back to them (x.cleared) - or the owner reports the activity was not theirs and control is rebuilt through IDN-88."
  summary: "When a compromise signal opens, the first question is whether any contact point sits outside the suspicion; if every route is implicated, nothing is sent and that withholding is recorded. Otherwise the owner is told either what has been restricted and why, or - where nothing was restricted - that this is a question and not an accusation. Their answer clears the signal and lifts the restriction, or confirms the compromise and hands off to secure recovery; if the review point passes with no answer, the owner is told the incident is still open and that nothing is required of them."
  handoffs:
    - "IDN-88 - a confirmed compromise where the owner needs secure control of the account rebuilt."

classification:
  journey_types:
    - communication
    - communication-heavy
    - handoff
    - multi-branch
    - nested-decision
    - no-deadline
