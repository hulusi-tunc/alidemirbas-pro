planned_changes:
  - "Merge w.verify with c.outcome into one 'what did the answer establish' card carrying the two branches; the timeout arm into a.standing stays a separate labelled edge off that card - P-WAITRES-01."
  - "Merge a.cleared+x.cleared and a.standing+x.open into single ending cards (each exit has exactly one parent), with the exit class carried as a badge rather than a second box - P-TERM-02."
  - "Demote c.route ('is there a destination the signal does not implicate?') to a reachability chip on the alert cards with one muted stub to x.withheld (class no-action) - P-GATE-01. It is a sendability check, not a security decision, but the withheld ending must remain readable because withholding an alert is a stated outcome here."
  - "Keep c.contained drawn as a real decision: 'containment applied' vs 'nothing restricted' produces two materially different messages and is the journey's core branch."
  - "Keep h.recovery (IDN-88) visible - it is the consequential ending of this journey."

