planned_changes:
  - "The heaviest journey in the slice: 37 measured display nodes, 20 drawn canonical nodes, 10 measured Internal cards from 5 canonical execution:null nodes, and all 5 are long cards (a.default 280, a.decided 244, a.evaluate 241, a.non-renew 238, a.review 182). Every one is renewal_log bookkeeping."
  - "P-READ-01: a.evaluate folds into c.notice, and a.default folds into c.decision."
  - "P-RECORD-01: a.decided folds into h.execute and a.non-renew folds into h.scheduled-end. Safe because the two outcomes already land on two different handoffs, so the distinction survives the fold; the 'decided is not renewed' reasoning must go to the handoff's detail panel."
  - "P-INTERNAL-01: a.review (two parents, single edge into w.review) folds into the wait, with c.blockers 'Blocked' and c.model 'Review first' merging on it (P-MERGE-01, centred)."
  - "P-LABEL-01 is load-bearing on a.default's fold: w.decision's timeout edge must read as 'No decision by the deadline - the terms' default applies', otherwise hiding the node makes the default look like a decision somebody took. The branch label 'Auto-renew, requirements met' (28 chars) also needs shortening."
  - "P-STATE-01: c.notice and c.notice-required are two sequential term-reading conditions that together answer 'what do the governing terms actually require here?'. They are both business-meaningful (one hands off, one sends the notice) so group their presentation rather than hiding either."
  - "All five conditions stay visible; none of them is an implementation gate - this journey's clutter is entirely bookkeeping actions, not gates."
  - "P-HANDOFF-02: three of the four handoff targets (DEC-181, OWN-55, SUB-164) are on the archived operational surface and render as named unlinked cards; only SUB-168 is a public route. The rule must not make the three archived ones look broken or dead."

