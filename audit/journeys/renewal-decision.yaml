journey_id: SUB-163
slug: renewal-decision
status: audited

story:
  trigger: "A renewal decision window opened on a continuing relationship (renewal_decision_window_opens)."
  entity: "The continuing relationship and the renewal cycle currently open on it."
  objective: "Reach a recorded decision about the next term before the notice deadline - give the notice the terms require, put the decision to whoever holds it where one is needed, and apply what the terms define when nobody answers."
  success: "h.execute -> SUB-164, a renewal decided and ready for execution (decided is not renewed - the new term does not exist until its own requirements are met)."
  summary: "A renewal window opens and the governing terms drive everything: if they do not define the notice period or the renewing terms, the case hands off rather than guessing. Where notice is required it is given as notice and never treated as the answer; where the model requires a choice, the decision is put to whoever holds it, and a deadline that passes applies the terms' default while recording that no decision was made. Blockers park the cycle in review with the current term still running."
  handoffs:
    - "h.undefined -> DEC-181 (archived / operational surface), a renewal window with no defined notice period or renewing terms."
    - "h.escalate -> OWN-55 (archived / operational surface), a renewal review outliving the notice period."
    - "h.execute -> SUB-164 (archived / operational surface), a renewal decided and ready for execution."
    - "h.scheduled-end -> SUB-168, a non-renewal scheduling an end at the current term's end."

