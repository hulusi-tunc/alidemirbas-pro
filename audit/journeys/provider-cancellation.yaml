  unnecessary_internal_nodes: 4      # a.scope, a.protect (entry context pair), a.release-old, a.release-cancel (the 'release the obsolete allocation' halves of two compound acts)
  technical_conditions_groupable: 1  # c.notify - a send-necessity gate ('does anything the customer needs to know actually change?')
  router_message_collapsible: false
  shared_terminal_candidate: true    # x.reallocated has two parents (a.inform, c.notify 'It does not')
  long_text_present: true            # a.reallocate 313/298, a.scope 275, a.protect 274, a.cancel 273, a.release-cancel 211, a.release-old 161
