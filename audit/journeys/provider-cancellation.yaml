journey_id: SCH-180
slug: provider-cancellation
status: audited

story:
  trigger: "A confirmed reservation can no longer be fulfilled by its assigned provider or resource - unavailability, resource failure, location closure, withdrawn capacity, an operational incident (provider_or_resource_cannot_fulfil)."
  entity: "Every reservation the failure touches, plus the provider or resource failure behind them (booking_id + provider_failure_id). A closed location is not one cancellation."
  objective: "Recover a commitment we cannot keep, without any of the cost landing on the person who was ready."
  success: "The booking is reallocated to a replacement that actually satisfies the service's requirements, at the same time, with the customer told only what genuinely changed (x.reallocated)."
  summary: "The full scope of the failure is identified and recorded as provider-side before anything else touches the booking, so the customer is never marked as having cancelled or missed it. An equivalent replacement keeps the time and the commitment; otherwise the journey either hands to rescheduling or cancels on the provider side, tells the customer before any money question is worked out, and routes the service obligation and the refund to their own lifecycles."
  handoffs:
    - "SCH-175 - a provider-side failure recoverable at another time"
    - "REM-157 - a service obligation left unresolved by a provider-side failure"
    - "FIN-137 - a provider-cancelled booking that was paid for"

classification:
  journey_types:
    - communication
    - handoff
    - multi-branch
    - nested-decision
    - recovery
    - routing-heavy
    - shared-exit

