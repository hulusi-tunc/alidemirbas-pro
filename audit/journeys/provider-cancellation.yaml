planned_changes:
  - "The largest canvas in this slice (34 nodes) and the most Internal cards (12 for 6 nodes). Every one of the six is execution:null; only two of them are business acts."
  - "Merge the a.scope -> a.protect chain and then forward into c.replacement (P-INTERNAL-02 then P-CHECK-01): scoping the failure and recording it as provider-side is the premise of 'is an equivalent replacement available?'. The 'never classified as a no-show' rule must survive in the detail panel - it is a canonical rule of this journey, not an implementation note."
  - "Merge a.reallocate + a.release-old into ONE card (P-INTERNAL-02) and a.cancel + a.release-cancel into ONE card. Reallocating and releasing the old slot is one act to a reader; so is cancelling and stopping the obsolete reminders."
  - "Do NOT let P-CHECK-01 absorb a.reallocate or a.cancel into the condition that follows them - the merged card is the branch's whole content, and absorbing it would leave a branch label pointing at a question. Guard: an internal action whose predecessor is a condition branch and whose content is a state change keeps its card."
  - "Clamp all six bodies to their first sentence (P-TEXT-01) and shorten 'An unresolved service obligation' (32) on the c.remedy edge (P-LABEL-01)."
  - "Draw x.reallocated once per parent (P-TERM-01); keep all three handoffs - reschedule, remedy and refund are three separate lifecycles by design."

