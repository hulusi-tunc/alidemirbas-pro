journey_id: TIM-63
slug: pre-expiry-window
status: audited

story:
  trigger: "A time-bound entity entered its pre-expiry window (pre_expiry_window_entered)."
  entity: "The time-bound entity approaching expiry - a subscription, document, entitlement, credential, approval, reservation, benefit or agreement."
  objective: "Use the window before an expiry only where acting inside it could actually change what happens: tell whoever can act what is expiring, the one action that changes the outcome, and the point it stops being available - or say plainly what will happen, or say nothing."
  success: "h.resolved -> external:renewal-lifecycle, the entity renewed, completed or replaced before its expiry, with the queued expiry actions invalidated."
  summary: "A schedule opens an expiry window, so the first thing the journey does is re-read the entity - it may already have been renewed or replaced. If an action exists that would change the outcome, it establishes who can actually perform it and tells that person what, and by when. If nothing can be done it either says plainly what will happen or says nothing at all, and the window ends either in resolution or in the expiry itself."
  handoffs:
    - "h.resolved -> external:renewal-lifecycle, an entity resolved before its expiry."
    - "h.expiry -> TIM-64 (archived / operational surface), the window closing without resolution."

