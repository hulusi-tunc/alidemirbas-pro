journey_id: IDN-81
slug: identity-claim-verification
status: audited

story:
  trigger: "A process or policy requires a specific identity claim to be verified at a stated scope and assurance."
  entity: "The individual identity claim - which attribute, at what assurance, for what purpose (claim_id)."
  objective: "Establish confidence in one specific identity claim, bound to the evidence that established it."
  success: "The claim is marked VERIFIED at the assurance the evidence supports, for the scope it covers, together with the evidence that established it."
  summary: "A required verification asks for the minimum evidence that claim needs - or skips asking when sufficient evidence is already held - and validates what arrives against the claim’s acceptance rules. Verified closes it, rejected goes to IDN-84, an inconclusive result buys another evidence round while policy allows one, and anything needing a person goes to DEC-181."
  handoffs:
    - "DEC-181 - a claim automated validation cannot settle (reached from two places)"
    - "IDN-84 - verification failing against a claim"

