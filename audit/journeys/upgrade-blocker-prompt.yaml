journey_id: RLT-279
slug: upgrade-blocker-prompt
status: audited

story:
  trigger: "A target is authoritatively held for a planned change by one named, resolvable prerequisite."
  entity: "The target, the change waiting on it, and the named prerequisite blocking it (target_id + change_id)."
  objective: "Tell the holder of a blocked target the one specific thing standing between it and the change, while there is still enough of the preparation window left for them to clear it."
  success: "The named prerequisite is satisfied inside the preparation window and the change resumes at RLT-242."
  summary: "A blocked target is first tested for whether its holder can actually clear the blocker: where they cannot, they are told the change is held and nothing is asked of them. Where they can, the one prerequisite is named with the date it stops mattering, with at most one further prompt; a window that closes with the blocker outstanding is recorded as unprepared, not as a failed change."
  handoffs:
    - "RLT-242 - a named prerequisite cleared by the holder inside the preparation window (reached from two places)"

