planned_changes:
  - "Hide a.identify: an execution:null action whose only consumer is the condition directly after it (c.blocking). Its content belongs on the trigger card or the detail panel, not as a card."
  - "Hide a.stop-reminders and show 'reminders stopped' as a badge on the requirement-satisfied edge - it writes suppressed_sends and adds no new step to the story."
  - "Draw c.blocking as an inline gate with a compact 'not a blocker' outcome chip rather than a full diamond plus a full exit card."
  - "Shorten the four >24-char branch labels ('Incomplete but not blocking', 'No, it depends on someone else', 'An alternate route exists', 'Another requirement is blocking') to business-readable short forms; keep the full 'when' text in the detail panel."
  - "Centre w.resolve under the two sibling actions that both feed it (a.specific-action, a.route-dependency)."

