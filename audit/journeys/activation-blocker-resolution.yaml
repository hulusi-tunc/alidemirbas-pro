journey_id: ACT-13
slug: activation-blocker-resolution
status: audited

story:
  trigger: "Activation stalls because one specific, named requirement is missing - an integration not connected, a configuration absent, a verification incomplete, a required person not yet present."
  entity: "The blocking requirement itself, held against the account or onboarding instance - two blockers are two separate instances."
  objective: "Get that one named requirement satisfied and put onboarding back in motion, instead of sending a generic finish-your-setup prompt."
  success: "The requirement is satisfied, every queued reminder about it stops, and activation is reachable again - onboarding resumes under ACT-12."
  summary: "One named thing is missing and activation cannot continue. The journey decides whether the account can clear it themselves or whether it depends on somebody else, asks the right party once, and waits for the requirement to be met. If it is met, activation resumes; if it is not, the blocker is escalated to a person, rerouted around, or recorded as genuinely blocked."
  handoffs:
    - "ACT-12 - the blocker cleared and activation is reachable again"
    - "external:human-in-the-loop-lifecycle - a blocker that outlived its resolution horizon"
    - "ACT-11 - an alternate path to value that does not need the blocked thing"

classification:
  journey_types:
    - communication
    - external-handoff
    - handoff
    - human-vs-automated
    - multi-branch
    - nested-decision
    - no-deadline
    - wait-event-timeout

