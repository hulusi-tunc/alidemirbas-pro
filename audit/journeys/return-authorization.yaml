journey_id: REM-152
slug: return-authorization
status: audited

story:
  trigger: "A request is made to send back an identified item, resource or deliverable."
  entity: "The return request and the original fulfillment it concerns (return_request_id)."
  objective: "Decide whether something may enter a return process, as a decision kept separate from whether money is owed."
  success: "RETURN_AUTHORIZED with a scope, a method and a validity, the requester told, and transit handed to REM-153."
  summary: "A return request is first tested for whether a return process applies at all, then against whatever return policy governs it; a deterministic policy authorises or refuses, an open one goes to a reviewer. Authorisation permits the resource to come back and decides nothing about a refund - that is a separate question with its own rules and its own answer."
  handoffs:
    - "REM-157 - a return requested against something that cannot be returned"
    - "DEC-181 - a return request with no governing eligibility policy"
    - "OWN-55 - a return decision outliving its SLA"
    - "REM-153 - an authorised return, for transit"

