journey_id: SCH-277
slug: reservation-outcome-notice
status: audited

story:
  trigger: "A reservation request is recorded for a named resource and slot."
  entity: "The reservation request, the requester, and the resource and slot it names."
  objective: "Tell the requester whether the specific time they asked for is now a commitment, and where it is not, offer the nearest time that actually exists - because the availability they were shown earlier was a picture and never a hold."
  success: "The slot is committed and stated back concretely - date, time, place, what is needed on arrival (x.confirmed) - or a requester takes one of the alternatives offered and rebooking takes over."
  summary: "A request is acknowledged immediately with an explicit statement that it is not yet a commitment and when the outcome will come. Revalidation then lands one of three ways: committed and confirmed in concrete terms, gone but with a genuine near alternative offered on a deadline, or gone with nothing near and a plain decline that names when capacity of this kind is next expected. If the outcome never arrives, the request is closed as lapsed and the requester is told nothing is held."
  handoffs:
    - "SCH-173 - a requester choosing one of the alternative slots offered to them."

