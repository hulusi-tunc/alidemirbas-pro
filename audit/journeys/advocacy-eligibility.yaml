journey_id: FBK-42
slug: advocacy-eligibility
status: audited

story:
  trigger: "A potential advocacy opportunity is detected for a relationship (a moment where we might ask someone to vouch for us)."
  entity: "The person or account plus the relationship context the advocacy would be about."
  objective: "Ask someone to vouch for us only where the relationship has actually earned it, sized to the evidence, and keep public reuse a separate permission."
  success: "The person contributes - a rating, review, testimonial, case study or reference - and where we intend to publish it, permission is obtained through its own journey (x.contributed, or the CON-31 handoff)."
  summary: "When an advocacy opportunity appears, anything unresolved in the relationship suppresses the ask outright. Otherwise the accumulated positive evidence is weighed: thin evidence defers the ask, sufficient evidence sizes it - a low-commitment rating or a high-commitment testimonial - and the ask goes out once with no follow-up sequence. What comes back either ends internally, ends as a decline, or hands off to a separate permission journey before anything is published."
  handoffs:
    - "CON-31 - an intention to publicly reuse something the person contributed (publication permission is deliberately a separate decision)."

classification:
  journey_types:
    - communication
    - handoff
    - multi-branch
    - nested-decision
    - no-deadline
    - wait-event-timeout

