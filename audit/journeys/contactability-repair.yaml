journey_id: CON-272
slug: contactability-repair
status: audited

story:
  trigger: "A permanent delivery failure is recorded against one specific contact point."
  entity: "The person plus the one contact point that failed - this address, this number, this token (contact_point_id + person_id)."
  objective: "Get a dead destination replaced by asking on a route that still works, so a delivery failure is repaired once rather than retried blind - and without either side mistaking it for a change of permission."
  success: "A replacement destination is supplied and verified, confirmed on the working route, with permission explicitly unchanged - or the original destination proves deliverable again on its own evidence."
  summary: "When a contact point dies, the repair request goes out on a surviving route that is both working and permitted - never on the dead one - and never at all if no such route exists. One repair cycle: a verified replacement is confirmed and the confirmation says this changed where things go, not what may be sent; anything else leaves the destination suppressed."
