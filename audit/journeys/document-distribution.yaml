journey_id: DOC-214
slug: document-distribution
status: audited

story:
  trigger: "An issued document version requires distribution to a named recipient."
  entity: "The issued version, the intended recipient, and the distribution of one to the other (document_version_id + recipient_id)."
  objective: "Get a specific issued version to the party who should have it, without delivery state and document validity ever touching each other."
  success: "Delivery or availability is established to the level the requirement demands, recorded against the exact version - and the document’s validity is unchanged by it either way."
  summary: "A document that has been issued is bound to its exact version and to the party permitted to receive it, then sent through the canonical communication mechanism rather than a parallel delivery path. A confirmed delivery is recorded against that version; an authoritative failure goes to CMS-208 and an outcome nobody can establish goes to external reconciliation, recorded as unknown and never as delivered."
  handoffs:
    - "CMS-208 - a failed document distribution"
    - "external:external-status-reconciliation - a distribution whose outcome could not be established"

classification:
  journey_types:
    - communication
    - external-handoff
    - handoff
    - multi-branch
    - no-deadline
    - routing-heavy
    - wait-event-timeout

