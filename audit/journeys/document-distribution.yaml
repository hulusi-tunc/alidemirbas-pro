planned_changes:
  - "Worst clutter ratio in the slice: 4 of 11 canonical nodes are execution:null bookkeeping and all four are over-length cards. a.recipient is route resolution and a.version is the version binding - both are preconditions of a.distribute and should collapse into one \"Send this issued version to the permitted recipient\" card (P-COMM-01 widened past channelPriority, plus P-RECORD-01)."
  - "a.confirmed -> x.distributed and a.unknown -> h.reconcile are record-then-terminate pairs; fold each state write into the terminal it precedes (P-SEAL-01)."
  - "Fold c.outcome into w.distribution (P-WAIT-02); move the \"delivery state describes the distribution, never the document\" rationale to the detail panel (P-DETAIL-01)."

