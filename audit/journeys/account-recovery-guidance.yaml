journey_id: IDN-270
slug: account-recovery-guidance
status: audited

story:
  trigger: "A recovery case is authoritatively opened against an existing account by somebody who cannot authenticate."
  entity: "One recovery case on one existing account, inside one stated recovery window (recovery_case_id)."
  objective: "Carry somebody who cannot sign in through the evidence their recovery basis actually requires, inside a stated window, on a route no weaker than the login it replaces."
  success: "Control is proven, access is restored, and the confirmation names what was invalidated on the way - or the case is closed because the person got back in by ordinary means."
  summary: "A locked-out account holder is sent a recovery route to a destination the account already held, with the required evidence and the window end named. Proof of control restores access and the confirmation says which sessions and credentials were cut off; one reminder is allowed if the window still has room, and the window closes without proof otherwise."
  handoffs:
    - "IDN-90 - a recovery attempt on an account already under an open compromise signal"

classification:
  journey_types:
    - back-edge-retry
    - communication
    - communication-heavy
    - deadline-driven
    - handoff
    - multi-branch
    - shared-exit
    - wait-event-timeout

