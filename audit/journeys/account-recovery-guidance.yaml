planned_changes:
  - "Fold c.proof and c.remind into their waits: both are pure wait-outcome demuxes whose branches restate w.proof/w.final until-events and timeout (P-WAIT-02)."
  - "Keep c.incident visible - routing an active-compromise account to IDN-90 instead of issuing a recovery route is the journey’s first real business decision."
  - "Keep the three endings distinct (restored / closed unused / window closed) and keep x.closed drawn once per parent rather than as one bottom-of-canvas node."

