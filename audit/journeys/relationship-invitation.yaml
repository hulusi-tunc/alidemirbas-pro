journey_id: REL-284
slug: relationship-invitation
status: audited

story:
  trigger: "A party holding the authority to extend one issues an invitation to link to a named counterparty, with a stated scope, direction and expiry."
  entity: "The invitation itself - not the two parties. A different scope or the opposite direction is its own instance."
  objective: "Put the proposed link in front of the party who has to accept it, on terms they can see before answering, and close the question before the invitation goes stale."
  success: "The counterparty accepts, the link is active, and both sides are told its scope and direction with both identities intact."
  summary: "An invitation is put to the counterparty in one of two registers - an existing holder is told what accepting would and would not change about their own record, while somebody new to us is told plainly that accepting creates a link rather than a transfer. One reminder follows if time remains, and the invitation ends accepted, declined or withdrawn, or expires unanswered."
