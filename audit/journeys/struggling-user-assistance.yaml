planned_changes:
  - "No execution:null nodes and no long cards at all - 31 measured display nodes come entirely from entry gates and terminal instances. This journey is the clearest evidence that the internal-node rules and the terminal/gate rules are independent problems."
  - "P-GATE-02: c.hard-entry ('are the hard entry conditions met?' -> x.not-eligible, no-action) and c.duplicate ('is a person already working this same blocker?' -> x.defer, suppression) are two consecutive binary gates between the trigger and the first real action. The shipped single-gate rule refuses both - c.hard-entry because its continuation is another condition, c.duplicate because its short arm is class suppression rather than no-action - so both are drawn today. Collapse the pair into one 'Eligible, and nobody already on it?' card with a single compact suppressed arm that names both reasons."
  - "P-TERM-01: x.normal has four parents (a.followup, c.followup 'No', a.final, c.final-option 'Not worth it') and h.activated has two. Local instances are correct, but this is the journey where the compact exit (P-EXIT-01) matters most - six of the drawn boxes are terminals."
  - "P-MERGE-01: c.followup and c.final-option each fan into a communication action and into x.normal; centre those merges."
  - "c.what-happened, c.outcome, c.followup and c.final-option are all real business decisions - the 'stop asking' discipline this journey exists for lives entirely in c.followup and c.final-option, so neither may be treated as a gate even though both have a 'nothing worth sending' arm."
  - "Note the near-miss for the gate rule: c.followup and c.final-option both have a negative arm reaching x.normal (class success), so no no-action heuristic can touch them. That is the right outcome by accident, not by design - the guard should be explicit."

canonical_logic:
  mutation_required: false

