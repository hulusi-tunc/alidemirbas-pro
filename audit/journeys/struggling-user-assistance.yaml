journey_id: ACT-14
slug: struggling-user-assistance
status: audited

story:
  trigger: "Somebody is visibly seeking help without making activation progress (help_seeking_without_activation_progress)."
  entity: "The person or account plus the open onboarding or trial instance."
  objective: "Offer help named against the step the person keeps returning to, and stop asking once they have answered - one offer, one confirmation, one follow-up, never a third ask."
  success: "x.normal - the rescue attempt closed and the ordinary lifecycle resumes; the strongest outcome is h.activated, activation reached with or without a session."
  summary: "Someone is clearly stuck and asking for help without activating. If nobody else is already working the same blocker, they are offered assisted setup plus a self-service route for the step they keep hitting. A booking gets a confirmation and a session outcome; silence gets at most one final self-service option; a decline ends it. The journey never asks a third time."
  handoffs:
    - "h.activated -> ACT-16, activation reached with or without the assisted session (reached both from the person solving it themselves and from a session that worked)."

classification:
  journey_types:
    - communication
    - communication-heavy
    - handoff
    - multi-branch
    - nested-decision
    - no-deadline
    - shared-exit
    - shared-handoff
    - wait-event-timeout

