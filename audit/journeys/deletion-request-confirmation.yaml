journey_id: TRM-275
slug: deletion-request-confirmation
status: audited

story:
  trigger: "A data subject raised a deletion request against a named scope."
  entity: "The data subject and the single deletion request they raised, bounded by the scope that request names. One request, one record."
  objective: "Give the requester a durable record of what went, what stayed, under which obligation, and the date the request closed."
  success: "x.closed (terminal success) - the request is answered and closed on the record, either deleted in full or deleted with a named retention obligation."
  summary: "The request is acknowledged with the obligation's own response date, control of the named scope is established (asking only for the proof the obligation requires), and the resolved outcome is confirmed in writing - in full, or naming exactly what is retained and which obligation requires it."
  non_success_endings:
    - "x.unverified (invalid-state): the verification window closed without proof of control; the person is told plainly that nothing was deleted and a fresh request can be raised"
  handoffs:
    - "h.overdue -> external:data-protection-escalation when the mandated response window passes with no authoritative outcome to state"
  business_decisions:
    - "c.verified - is the requester's control of the named scope already established (the whole legitimacy of the deletion)"
    - "c.outcome - deleted in full, or partly retained under an authoritative obligation; the two different records the person keeps"
  implementation_checks:
    []
  bookkeeping_nodes:
    - "None - this journey has zero execution:null actions. It is the slice's control case: every node is a message, a decision, a wait or an ending, and it needs the fewest display rules of the thirteen"
  read_as_one_action:
    - "a.closed-full and a.closed-partial both close into x.closed - they are two messages, not two endings"
    - "w.decision + c.outcome as one 'deletion resolved -> what does the outcome say?' step"
  must_stay_visible:
    - "x.closed (success, reached from both closing messages - one compact instance per parent)"
    - "x.unverified"
    - "h.overdue (the mandated-window escalation is a named obligation of this journey)"

classification:
  journey_types:
    - communication
    - communication-heavy
    - deadline-driven
    - external-handoff
    - handoff
    - multi-branch
    - shared-exit
    - wait-event-timeout

