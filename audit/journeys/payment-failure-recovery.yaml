journey_id: FIN-134
slug: payment-failure-recovery
status: audited

story:
  trigger: "An authoritative payment failure is recorded against an obligation that is still outstanding."
  entity: "The failed attempt, the obligation behind it and the customer relationship it belongs to - the failure touches only the first of the three."
  objective: "Respond to the reason the payment actually failed, rather than to the fact that it failed, and keep the obligation alive while recovery runs."
  success: "A subsequent attempt discharges the obligation and the customer is told once that nothing further is expected."
  summary: "A payment failure is classified into the class the provider actually reported, and that class decides everything: a transient failure is retried silently, a customer-fixable one gets the exact corrective action named, and a decline with no usable reason goes to the alternate-route question - a stored method the system already has authority to use, or a choice the customer has to make. One reminder naming the consequence follows if the obligation is still open, and if recovery ends without payment, policy decides between grace, overdue tracking and access restriction."
  handoffs:
    - "TIM-65 - an unpaid obligation entering a grace period"
    - "TIM-62 - an unpaid obligation becoming overdue"
    - "ACC-78 - policy restricting capability while an obligation is unpaid"

