journey_id: INC-254
slug: incident-communication
status: audited

story:
  trigger: "An incident reaches a state change that could alter what an affected party should do or expect."
  entity: "The incident, the affected recipient cohort, and the communication obligation that this state change creates."
  objective: "Tell the people actually affected something true and useful, through the mechanism that already owns delivery."
  success: "An update is issued to the right cohort with the next update bound to a stated condition, or the resolution notice closes communication for that cohort."
  summary: "When an incident changes state, the journey establishes who is materially affected and what is actually known, scoping the message to that population or saying plainly that the boundary is still being established. Nothing unconfirmed is claimed. If the guidance the recipient already has has materially changed - or a commitment requires an update regardless - the communication is raised through the canonical communication mechanism; otherwise nothing is sent and the reason is recorded."
  handoffs: []

