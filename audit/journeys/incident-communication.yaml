planned_changes:
  - "Hide a.determine (313 chars, execution:null, single consumer c.cohort) - its content is the question c.cohort asks."
  - "a.scoped and a.broad are branch echoes: the two arms of c.cohort, each restating its own branch, both reconverging on c.verified. Drop both cards and carry their meaning in the branch labels ('scope to the affected population' / 'broaden and say the scope is still being established')."
  - "Hide a.hold-claim: it is the remediation arm of the c.verified gate and rejoins the same node; show it as the gate's label rather than a card."
  - "Merge a.no-send into x.no-send - internal action plus no-action exit is one compact 'nothing sent, reason recorded' outcome."
  - "Ten of the 25 rendered cards are plain Internal cards - the highest ratio in the slice. After the rules above, only the trigger, three decisions, one send and three outcomes remain."
  - "Shorten the 58-char and 49-char branch labels on c.material; the three-way distinction (material change / nothing changed / commitment requires one anyway) must survive the shortening."

