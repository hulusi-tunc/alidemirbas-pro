journey_id: ACQ-287
slug: checkout-abandonment
status: audited

story:
  trigger: "A checkout was started (authoritative checkout_started event) and no purchase record followed."
  entity: "One checkout instance - a basket, its items and its resume destination. Starting again after abandoning is a new instance, not a reopened one."
  objective: "Return the person to the checkout they started with a three-step reminder cascade, reaching for a more direct channel on the highest-value checkouts and never sending once the purchase is already recorded."
  success: "x.purchased - an authoritative purchase or order record exists for this checkout instance; reachable from all three checkpoints."
  summary: "After each of three waits (45 minutes, 6 hours, 24 hours) the journey re-reads whether the checkout completed; if not, it picks the highest-priority channel it can actually reach on and sends the next reminder. The second touch splits: high-value checkouts get a direct channel (WhatsApp then SMS), standard ones repeat push-then-email."
  non_success_endings:
    - "x.abandoned (timeout): the cascade ran to its end with no completion recorded"
  handoffs:
    []
  business_decisions:
    - "c.highvalue - the one real branch: at or above the adopting company's configured high-value threshold, which buys a more direct channel rather than a different message"
    - "c.completed1 / c.completed2 / c.completed3 - the same 'is it bought yet?' checkpoint asked once per stage; business-meaningful (it is the suppression that stops a reminder about a completed purchase) but identical three times"
  implementation_checks:
    []
  bookkeeping_nodes:
    - "None. The three execution:null nodes are channel routers, not bookkeeping - they carry the permission-and-reachability priority that the message card should state, which is why they merge into the send rather than disappear"
  read_as_one_action:
    - "a.router1 + a.reminder1 -> one 'first reminder (push, else email)' card"
    - "a.router2-hv + a.reminder2-hv -> one 'second reminder, direct (WhatsApp, else SMS)' card"
    - "a.router2-std + a.reminder2-std -> one 'second reminder (push, else email)' card"
  must_stay_visible:
    - "x.purchased (one compact instance per checkpoint, so each checkpoint's success stays beside it)"
    - "x.abandoned"

classification:
  journey_types:
    - communication
    - communication-heavy
