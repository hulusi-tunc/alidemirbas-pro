planned_changes:
  - "The router collapse (P-COMM-01) already applies to all three routers - this journey is the clearest corpus evidence that the rule is right: 16 canonical nodes draw as 13 distinct cards and the channel priority survives on the message card."
  - "Fold c.completed1/2/3 into their waits (P-WAITARM-01) and give the three identical checkpoints one repeated form (P-RECHECK-01); the reader should see 'still not bought?' three times in the same shape, not three separate decisions."
  - "All three waits have onEvent and onTimeout reaching the same condition - the merged 'on event . on timeout' label says nothing and should be dropped entirely (P-WAIT-01)."
  - "Note for the corpus-wide rules: this journey carries no eligibility, suppressions, channelStrategy or orchestration (it is not vNext-migrated), so any display rule that reads the touch plan must degrade to the node graph alone."

