journey_id: FUL-146
slug: fulfillment-delay
status: audited

story:
  trigger: "The expected timing of an obligation slipped (expected_fulfillment_timing_slipped)."
  entity: "The obligation and its timing commitment, carrying the full history of what was promised."
  objective: "Hold lateness as its own state with the original commitment intact behind every revised estimate, tell the recipient whenever the change moves something they planned around, and escalate rather than go silent once the delay passes tolerance."
  success: "h.resume -> FUL-144, the delayed obligation resuming or completing."
  summary: "An obligation is late. The journey establishes whether a reliable new estimate exists - and refuses to invent one if it does not - then tells the recipient whenever the change moves anything they arranged around it. Inside tolerance it waits for resumption; beyond tolerance it either offers the choices that genuinely exist (wait, reschedule, alternative, cancel) or says plainly that there is no option and escalates."
  handoffs:
    - "h.resume -> FUL-144, a delayed obligation resuming."
    - "h.exception -> FUL-145, a counterparty choosing an alternative over waiting."
    - "h.cancel -> FUL-150, a counterparty cancelling rather than waiting."
    - "h.escalate -> OWN-55 (archived / operational surface), a delay beyond tolerance with nothing to offer, or one outliving its revised horizon."

