planned_changes:
  - "Eight measured Internal cards from four canonical nodes, and all four are the journey's long cards (a.assess 258, a.update 233, a.no-estimate 225, a.reschedule 113). Every one of them is execution:null record-keeping: assess and record DELAYED, append the new estimate to the commitment history, record that no estimate exists, record the rescheduled commitment."
  - "P-READ-01: a.assess folds into c.estimate ('Is there a reliable new completion estimate?')."
  - "P-INTERNAL-01 with a hard precondition: a.update and a.no-estimate sit on opposite arms of c.estimate and both step into c.recipient-impact. They may only be hidden if c.estimate's branch labels are promoted to carry the difference ('A reliable estimate' / 'No reliable estimate' already do). Both arms then merge into c.recipient-impact - P-MERGE-01, centred."
  - "P-INTERNAL-01 for a.reschedule likewise: c.decision's arms 'Wait' and 'Reschedule' both reach w.resume, and the label is what tells them apart once the record node is hidden."
  - "P-DETAIL-01: the authored reasoning these nodes carry is some of the strongest in the corpus ('repeatedly promising dates that do not hold costs more trust than admitting the date is unknown') and must land in the detail panel, not be deleted with the card."
  - "P-TERM-01: h.escalate has two parents (a.no-choice-update and w.resume's timeout) - draw it once per parent, since 'beyond tolerance with nothing to offer' and 'outlived its revised horizon' are different escalations."
  - "P-HANDOFF-02: h.escalate targets OWN-55, which is on the archived operational surface, so it must render as a named but unlinked handoff card - never a dead link and never a bare id."
  - "P-LABEL-01: 'No material change for them' (27 chars) on c.recipient-impact."

