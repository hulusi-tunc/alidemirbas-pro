journey_id: DOC-220
slug: document-conflict
status: audited

story:
  trigger: "A material inconsistency is detected in a document lineage - different content under one identifier, a wrong version distributed, a signature on the wrong version, several versions claiming current status (document_version_inconsistency_detected)."
  entity: "The document lineage and every conflicting record claiming to be part of it (document_lineage_id + conflict_id)."
  objective: "Work out which version actually governs, and explain the conflict rather than deleting it."
  success: "The authoritative version is established, every conflicting record is preserved alongside it, and anyone holding the wrong version is told what changed (x.reconciled)."
  summary: "Conflicting document records are gathered and tested against lineage, issuance authority and effective semantics. Where one version is deterministically authoritative it is recorded as such with the rest preserved as evidence; where two have equal claim nothing is changed and a human decides. Signatures bound to the wrong version and business actions taken on the wrong version each hand to their own remedy journey, and a recipient holding a superseded version is sent the correct one with an explicit statement of what it replaces."
  handoffs:
    - "DEC-181 - a conflict where the authoritative version cannot be safely determined"
    - "DOC-215 - signatures that bind to a version other than the authoritative one"
    - "REM-157 - a business action taken on a non-authoritative document version"

classification:
  journey_types:
    - communication
    - handoff
    - multi-branch
    - nested-decision
    - routing-heavy
    - shared-exit

display_audit:
  display_node_count_before: 27
  unnecessary_internal_nodes: 4      # a.collect (evidence gather), a.cannot, a.sig-invalid, a.preserve-history (all three are 'record it and hand off')
  technical_conditions_groupable: 0  # c.identifiable, c.signature and c.acted are all real business decisions
  router_message_collapsible: false
  shared_terminal_candidate: true    # x.reconciled has two parents (a.correct-distribution, c.acted 'Neither')
  long_text_present: true            # a.authoritative 644/654 - the longest card in the slice; also a.cannot 292, a.preserve-history 243, a.sig-invalid 236, a.collect 223
  locale_issue: false
