planned_changes:
  - "This journey has ten Internal cards for five internal nodes and only one communication action - it is the clearest case in the slice of implementation plumbing crowding out the story."
  - "Merge a.collect forward into c.identifiable (P-CHECK-01): gathering ids, hashes, issuance times and signature evidence is the premise of 'is the authoritative version deterministically identifiable?'."
  - "Merge a.cannot into h.review, a.sig-invalid into h.resign, and a.preserve-history into h.remedy (P-RECORD-01). Each is an internal action whose single edge goes to a handoff; the handoff card already names the outcome, so three cards become three detail panels."
  - "Merge a.authoritative forward into c.signature (P-CHECK-01) - allowed here because c.signature has no other parent, so no branch distinction is lost. Its 644-char body must go to the panel either way (P-TEXT-01)."
  - "Rewrite the two long branch labels ('Distributed, not acted upon' 27, 'Already used for a business action' 34) to fit the edge (P-LABEL-01)."
  - "Draw x.reconciled once per parent (P-TERM-01) and keep all three handoffs visible - they are three genuinely different remedies."

