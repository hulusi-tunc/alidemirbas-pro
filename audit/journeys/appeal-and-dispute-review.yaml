journey_id: FBK-47
slug: appeal-and-dispute-review
status: audited

story:
  trigger: "Somebody submits an appeal or dispute against a decision that has already been made (appeal_or_dispute_submitted)."
  entity: "The appeal, linked to the original decision it contests. Two entities throughout - the decision and the appeal - and both survive the outcome."
  objective: "Review a decision already made, without erasing it while the review runs."
  success: "The review concludes (upheld, reversed or modified), the effective business state is updated to match, and the appellant is told the conclusion, what now applies, and what remains available procedurally - with the original decision, the appeal and the outcome all still readable."
  summary: "An appeal is linked to its decision and checked for eligibility; ineligible ones are declined with the actual reason. Where policy requires it the decision is suspended (a hold, never a reversal) while the review runs. The review's verdict drives one state update and one outcome message; a review that cannot conclude asks once for the missing evidence, and a missed deadline hands to DEC-181."
  handoffs:
    - "DEC-181 - a review deadline passing without a conclusion (reached from both waits)"

