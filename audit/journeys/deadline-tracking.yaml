journey_id: TIM-61
slug: deadline-tracking
status: audited

story:
  trigger: "A system or rule entitled to set one assigns an authoritative deadline to a specific obligation."
  entity: "The obligation the deadline is attached to - a task, request, case or application. The deadline belongs to the obligation, not to a date."
  objective: "Let the deadline govern the state of the obligation, rather than schedule messages around a date."
  success: "The obligation is satisfied before its deadline and every reminder and escalation still queued against it is invalidated."
  summary: "A deadline is recorded against an obligation together with what would actually satisfy it, and then tracked. Reaching a pre-deadline threshold produces at most the reminder policy defines; satisfaction ends the journey and cancels everything queued. If the deadline passes with the obligation still open, the governing rule decides between five outcomes - overdue, escalated, expired, failed, or simply still valid."
  handoffs:
    - "TIM-62 - an obligation surviving its deadline (overdue)"
    - "OWN-55 - a deadline whose governing rule escalates rather than changing the obligation"
    - "TIM-64 - a deadline at which the obligation itself ceases to be valid"

classification:
