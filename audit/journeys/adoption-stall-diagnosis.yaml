journey_id: ACT-18
slug: adoption-stall-diagnosis
status: audited

story:
  trigger: "An account did not meet the expected adoption pattern for one use-case, measured against the product's own rhythm."
  entity: "Person or account plus the specific product or use-case that stalled - not the whole account."
  objective: "Diagnose why value stopped in that use-case and address the specific blocker once, or record honestly that there is nothing to address."
  success: "The blocker is addressed and value is produced again, which hands the instance to ACT-17 (h.adoption)."
  summary: "A stall in one use-case is diagnosed before anything is sent: the evidence either names a specific blocker, a problem that needs a person, a need that was actually met, or nothing at all. Only the first produces a message, and the message addresses the named blocker rather than re-running onboarding."
  non_success_endings:
    - "x.satisfied (invalid-state): the use-case was completed - the need was met, not abandoned"
    - "x.no-intervention (no-action): usage looks light but nothing indicates a problem; encouragement into silence is the failure this journey avoids"
  handoffs:
    - "h.adoption -> ACT-17 when value is produced again"
    - "h.monitor -> external:health-monitoring when the recovery window closes without value returning"
    - "h.assistance -> external:human-in-the-loop-lifecycle when the blocker is technical and needs a person"
  business_decisions:
    - "c.type - 'what does the evidence show?' is the whole journey: recoverable blocker / needs a person / need genuinely met / no evidence of a problem"
  implementation_checks:
    []
  bookkeeping_nodes:
    - "a.diagnose - its 287-char EN (302-char TR) prose enumerates exactly the four categories c.type then branches on; it is the condition's own question written out as a card"
  read_as_one_action:
    - "a.diagnose + c.type read as one 'diagnose the stall' decision card"
  must_stay_visible:
    - "x.satisfied and x.no-intervention - the two 'send nothing' endings are the point of the journey and must not be hidden as bookkeeping"
    - "all three handoffs (ACT-17, health-monitoring, human-in-the-loop) - they are the three different owners a stall can end up with"

classification:
  journey_types:
    - communication
    - external-handoff
    - handoff
    - multi-branch
    - no-deadline
    - parallel-fan-out
    - wait-event-timeout

