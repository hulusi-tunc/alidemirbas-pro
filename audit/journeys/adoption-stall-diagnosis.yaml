planned_changes:
  - "Absorb a.diagnose into c.type (P-CLASSIFY-01): an execution:null action whose sole successor is a condition and whose prose enumerates that condition's branches needs no box of its own; its text becomes the decision card's detail."
  - "No card on this canvas should carry 287 characters of body text - cap the visible text and move the rest to the detail panel (P-DETAIL-01), measuring against the TR route where the same prose is ~5% longer."
  - "x.no-intervention is class no-action but is a genuine business ending here ('no problem found'); a generic 'hide no-action' rule must not swallow it - only a no-action exit that is the short arm of a binary gate qualifies (see P-GATE-01)."

