journey_id: ACT-19
slug: role-use-case-discovery
status: audited

story:
  trigger: "An onboarding decision depends on a named role or use-case and no reliable value for it exists."
  entity: "The person or account plus the specific onboarding context being decided; a different product's onboarding asks its own question."
  objective: "Get the one piece of context onboarding needs to choose a path - and only when not having it would actually change that path."
  success: "Onboarding continues on a path adapted to a declared answer, or on a documented default that is never written back as though somebody had chosen it."
  summary: "Before asking anything, the journey checks whether a reliable declared value already exists and whether a different answer would genuinely change the path - if not, nothing is asked. Otherwise one lightweight question goes out, and whether it is answered, reused or defaulted, onboarding resumes under ACT-12 with the declared value kept strictly apart from behavioural inference."
  handoffs:
    - "ACT-12 - the onboarding path resolved, adapted or defaulted"

