journey_id: FIN-137
slug: refund-request-decision
status: audited

story:
  trigger: "A refund is requested against an identified original transaction."
  entity: "The refund request and the original transaction it is made against (refund_request_id)."
  objective: "Turn a refund request into an authorised decision, without money moving on the request itself and without the original payment history being modified."
  success: "A decision is authorised - APPROVED with an amount and an authority - and execution is handed to FIN-138."
  summary: "A refund request is checked for standing and scope, then against whatever eligibility policy governs that transaction type. Policy that decides deterministically approves or refuses with the governing reason; policy that leaves it open, or no policy at all, puts the decision in front of a person with the requester told what \"under review\" means. Approval authorises the movement and performs none of it."
  handoffs:
    - "DEC-181 - a refund request with no governing eligibility policy"
    - "OWN-55 - a refund decision outliving its SLA"
    - "FIN-138 - a refund authorised for execution"

