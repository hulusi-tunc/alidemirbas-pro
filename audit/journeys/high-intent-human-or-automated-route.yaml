journey_id: ACQ-04
slug: high-intent-human-or-automated-route
status: audited

story:
  trigger: "A commercially serious act - a pricing request, an enterprise contact request, a completed quote, a sales-qualified submission or a high-value application (high_intent_commercial_action)."
  entity: "The lead, opportunity or account (lead_id, one active per key). The dedup step is the entity work: a second request against an open opportunity updates it rather than opening a rival."
  objective: "Decide whether the next step needs a person's judgement or can continue automatically - and resolve what already exists before creating anything."
  success: "The request continues on the right route: an owned internal commercial entity with a task carrying the evidence that justified it, or an automated continuation where a person would add latency without adding judgement."
  summary: "A high-intent action first resolves against what already exists, so an account that has already reached the destination hands straight to ACQ-08 instead of receiving acquisition contact. Everything else is judged on whether the next step genuinely needs a person; the human route creates or updates the commercial entity, assigns an owner and raises a task, and the automated route continues without one."
  handoffs:
    - "ACQ-08 - a high-intent action arriving after the destination was already reached"
    - "external:human-in-the-loop-lifecycle - an assigned owner now holding the next step"
    - "external:automated-continuation - a self-serve request that needs no human judgement"

classification:
  journey_types:
    - external-handoff
    - handoff
    - human-vs-automated
    - multi-branch
    - nested-decision
    - short

display_audit:
  display_node_count_before: 16
  unnecessary_internal_nodes: 1      # a.resolve - dedup/entity resolution, the premise of the condition that follows it
  technical_conditions_groupable: 1  # c.converted - an already-reached/dedupe state gate, not a commercial decision
  router_message_collapsible: false
  shared_terminal_candidate: false
  long_text_present: true            # a.resolve 207/201
  locale_issue: false
  unknown_node_types: []
  needed_visual_nodes: 7

patterns_detected:
  - P-CHECK-01
  - P-INTERNAL-01
  - P-TEXT-01
  - P-LABEL-01
  - P-HANDOFF-01
  - P-EXIT-01

severity:
  highest: P2

planned_changes:
  - "Merge a.resolve forward into c.converted (P-CHECK-01): 'resolve the existing account and any open opportunity' is how the question 'has this account already reached the destination?' is answered."
  - "Shorten 'Automated continuation is sufficient' (36 chars) to fit its edge; the full `when` prose stays in the panel (P-LABEL-01)."
  - "Keep a.assign drawn - execution is 'human', so it is a real person-facing step, not plumbing, and P-RECORD-01 must not absorb it into h.human even though its single edge goes to a handoff. The execution field is the guard."
  - "Keep c.human as the visual centre of the journey: it is the only decision here a reader came to see."
  - "All three handoffs stay visible; two are external, and an external handoff is where this journey's drawing ends."

