journey_id: CON-264
slug: contact-point-confirmation
status: audited

story:
  trigger: "A contact point is added or changed for an identity (contact_point_added_or_changed)."
  entity: "The specific contact point being added or changed, plus the identity it is claimed for (contact_point_id, one active per key)."
  objective: "Make a new destination usable only when that destination itself confirms it, and tell the destination being replaced that it is being replaced."
  success: "The new destination confirms from itself; permission is recorded against that destination and no other (x.permitted)."
  summary: "When a contact point replaces an existing one, the old destination is warned first - a takeover is invisible from the address taking over and obvious from the one losing access. The new destination is then asked to confirm itself, with exactly one reminder. Confirmation grants permission to that destination only; a dispute from the old destination hands to identity review, and silence leaves the destination unusable."
  handoffs:
    - "IDN-89 - a contact point change the previous destination says it did not make"

classification:
  journey_types:
    - back-edge-retry
    - communication
    - communication-heavy
    - deadline-driven
    - handoff
    - multi-branch
    - wait-event-timeout

