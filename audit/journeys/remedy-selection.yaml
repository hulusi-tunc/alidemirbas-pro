journey_id: REM-157
slug: remedy-selection
status: audited

story:
  trigger: "A remedy decision is required on a confirmed issue with an unresolved obligation and no remedy yet selected (authoritative)."
  entity: "The confirmed issue and the unresolved obligation behind it - the obligation is the input, not the complaint."
  objective: "Choose the remedy that would actually satisfy the unresolved obligation, from the ones that genuinely exist, and hand it to whoever executes it."
  success: "The obligation is resolved by the selected remedy - four handoffs (correction/reperformance, replacement, return, refund or credit) - or x.no-remedy, where the obligation turns out to be satisfied and the person is told so."
  summary: "The obligation is identified precisely, then only the remedies that can actually be delivered are evaluated. Where more than one would satisfy it the counterparty chooses, with a policy default applied if they do not answer; the selected route is handed to the journey that executes it."
  non_success_endings:
    - "x.no-remedy is class success, not a failure ending: the obligation is satisfied or policy provides no remedy, and that is stated with any real appeal route named. There is no invalid-state, suppression or timeout ending in this journey"
  handoffs:
    - "h.correction -> REM-156 (correction or reperformance)"
    - "h.replacement -> REM-155"
    - "h.return -> REM-152 (a return required before the remedy can settle)"
    - "h.financial -> FIN-137 (refund or credit)"
  business_decisions:
    - "c.choice - does the counterparty choose between remedies, or does one remedy apply / policy determine it"
    - "c.route - which remedy resolves the obligation; the five-way routing that is the journey's entire purpose"
  implementation_checks:
    []
  bookkeeping_nodes:
    - "a.obligation - identifies the obligation precisely (305 chars); entry content that belongs on the trigger card"
    - "a.evaluate - 'evaluate the remedies policy actually makes available' is what c.choice then branches on (254 chars)"
    - "a.default - applies the policy default when no selection arrives; its content is w.selection's timeout arm and belongs on that edge"
  read_as_one_action:
    - "a.obligation + the trigger as one 'remedy decision required on this obligation' entry"
    - "a.evaluate + c.choice as one 'which remedies are genuinely available, and whose choice is it?' decision"
    - "w.selection's timeout arm + a.default as one labelled 'no selection - policy default applied' edge into c.route"
    - "a.no-remedy + x.no-remedy as one ending card"
  must_stay_visible:
    - "all four handoffs - they are the five-way routing the journey exists for"
    - "x.no-remedy (saying nothing after a confirmed issue leaves the person believing the question is open)"

