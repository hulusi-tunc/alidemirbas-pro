journey_id: ACQ-13
slug: unresolved-interest-recovery
status: audited

story:
  trigger: "A behavioural interest signal is recorded - repeated, recent, attributed attention to an item, category or search that ended in neither a selection nor a process (interest_signal_recorded). The trigger is inferred, not authoritative, which is why a qualification step stands between it and any instance."
  entity: "An inferred interest: one person and one interest key (person_id + interest_key). A new key is a new interest."
  objective: "Bring a person whose attention qualified as interest back to the thing they looked at, once, without asserting stock, price or intent the system does not hold - and leave everyone else alone."
  success: "The interest resolves: a selection, process or purchase for the subject is recorded and its own journey owns the person from that moment (x.resolved)."
  summary: "Most attention does not qualify, and recording no-action is the designed common outcome. Attention that does qualify opens an instance and settles briefly; if it is still unresolved and the subject is still available, one touch shows the thing as it stands now and claims nothing more. A second window then either sees the interest resolve or lets it lapse - there is no second touch."
  handoffs: []

