planned_changes:
  - "P0: the existing no-action gate collapse hides three canonical nodes here (measured: 10 of 13 rendered) - c.sendable, a.record-no-action AND x.no-action. Collapsing c.sendable is correct, but a.record-no-action is ALSO the target of c.qualify's third branch ('Does not qualify'), and c.qualify is a three-branch condition that was never collapsed. Hiding the shared bookkeeping node severs that branch, so the canvas draws c.qualify with two arms instead of three and never draws x.no-action - the outcome this journey's own purpose calls its common one."
  - "Add the P-GATE-02 guard: a gate collapse may hide a bookkeeping hop or exit only when every remaining in-edge to it comes from a node hidden by the SAME collapse. Here it does not, so a.record-no-action stays - merged into x.no-action by P-RECORD-01 - and c.qualify keeps all three arms."
  - "Merge a.open forward into w.settle (P-CHECK-01): opening the instance and starting the clock is what the settle window IS."
  - "x.resolved has four parents (c.qualify, w.settle, w.after, c.state). Per-parent instancing would put four copies of one exit on a 10-node canvas - apply P-TERM-02 and draw it once with merged incoming edges."
  - "c.state and c.sendable are two sequential conditions answering one question, 'is this still worth sending, and may it go?' (P-STATE-01): keep c.state's three business outcomes and absorb c.sendable's gate into the touch."
  - "Shorten 'Unresolved, subject available' (29) and clamp a.open's 208 chars to its first sentence (P-LABEL-01, P-TEXT-01)."

