planned_changes:
  - "Merge a.establish forward into c.route (P-CHECK-01). 'Establish what the expiry actually did' and 'which mechanism restores validity here?' are one step; today they are two cards and the first is 273 chars of Internal."
  - "Merge w.act and c.outcome into one card (P-WAIT-02): the wait's until events (validity_restored, recovery_attempt_abandoned) are c.outcome's two branches."
  - "That merge makes both the event arm and the timeout arm of the merged card point at x.still-expired - collapse them into one edge carrying both labels (P-WAIT-01)."
  - "Keep the four route actions as four separate cards. They are the journey's genuine business paths and three of them converge on w.act (P-MERGE-01) - the fan-in should be centred, not four crossing lines."
  - "Keep x.terminal ('no route back', the only terminal:true exit in this slice) visually distinct from x.still-expired - one is a permanent dead end, the other is an unused offer."

