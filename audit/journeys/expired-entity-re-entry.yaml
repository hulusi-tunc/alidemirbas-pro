journey_id: TIM-281
slug: expired-entity-re-entry
status: audited

story:
  trigger: "The holder of something that has expired tries to use, renew or ask about it after the expiry (holder_acted_on_expired_entity)."
  entity: "The expired entity and the holder's attempt to act on it, kept distinct from any replacement issued (entity_ref + attempt_id)."
  objective: "Give somebody who has come back to something expired the one route that actually restores it, at the moment they are asking."
  success: "Validity is restored by the route that was named, and the holder is told what they now hold - including, where a replacement was issued, that it is a new object rather than the old one revived (x.restored)."
  summary: "What the expiry actually did to the entity is established before anything is said, because naming the wrong route spends the only intent this ever gets. One of four routes is named - renew, requalify, replace, or no route back - and the journey then waits to see whether validity actually came back. A dead end is stated once and clearly; an abandoned attempt leaves the entity expired with the route on record."
  handoffs: []

classification:
  journey_types:
    - communication
    - communication-heavy
    - multi-branch
    - no-deadline
    - parallel-fan-out
    - shared-exit
    - wait-event-timeout

