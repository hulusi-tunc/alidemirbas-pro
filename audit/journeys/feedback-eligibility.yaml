journey_id: FBK-41
slug: feedback-eligibility
status: audited

story:
  trigger: "A potential feedback moment is recorded against a person and one specific experience."
  entity: "Person or account plus the specific experience being asked about (person_id + experience_ref)."
  objective: "Ask a person about one specific completed experience, once, at an appropriate moment - and not at all when the experience is incomplete, an issue is open, it was asked already, or the person has been asked enough."
  success: "One request goes out about that experience and feedback comes back; FBK-43 owns what it means."
  summary: "A feedback moment waits until the experience is actually complete from the person’s side, then passes a series of checks - no open issue in the context, nothing asked about it recently, and room in the bound on how often this person is asked anything - before a single request is sent. Anything that fails is a recorded non-ask rather than a delayed one."
