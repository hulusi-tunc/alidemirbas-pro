planned_changes:
  - "Absorb a.context (execution:null, writes:[], sole successor c.reason) into the c.reason card - reading what they hold is how the next question is answered - P-EVAL-01."
  - "Hide a.record-reason and a.no-reason: both are execution:null writes to cancellation_reason_history, both converge on c.resolution, and the branch labels above them already say which case the reader is in. Their `writes` and the reason taxonomy belong in the detail panel - P-INTERNAL-01 / P-DETAIL-01. These are the three 'Internal · NN' cards and the three >110-char cards measured on this journey."
  - "Group c.reason ('is a declared reason available?') and c.ask ('is asking useful and appropriate?') into one displayed decision - together they answer a single business question, 'do we have a reason worth having?' - P-STATE-01. Both branches out of the group stay: ask once, or proceed without."
  - "Merge w.answer with c.answered, and w.decision with c.decision, into single wait-outcome cards - P-WAITRES-01."
  - "x.lapsed has two parents (c.decision and the w.decision timeout); keep the existing per-parent terminal instancing so each path shows its own ending - P-TERM-01."
  - "Keep c.resolution drawn as a real decision: 'does a legitimate resolution exist for this reason' is the retention argument and gates the only offer in the journey."
  - "Centre the merge where the reason-known and reason-unknown paths rejoin at c.resolution - P-MERGE-01."

