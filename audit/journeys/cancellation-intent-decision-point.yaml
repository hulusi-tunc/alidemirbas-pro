journey_id: RET-28
slug: cancellation-intent-decision-point
status: audited

story:
  trigger: "A person explicitly declares an intent to cancel a subscription, membership or service relationship."
  entity: "The subscription, membership or service relationship being cancelled."
  objective: "At the moment cancellation intent is declared, learn why if that is useful, offer one genuine alternative if one matches the reason, and let the person decide - with the cancellation path fully open at every step."
  success: "The person makes an informed decision. A save (abandoning the flow with the relationship intact) and a clean confirmed cancellation handed to SUB-167 are both acceptable endings; the failure mode the journey exists to prevent is friction dressed up as a question."
  summary: "When someone declares they want to cancel, the journey reads what they actually hold, establishes whether a reason is known or worth asking for, and - only if the answer would change what is offered - asks once with the exit still open. If a legitimate alternative genuinely answers the stated reason it is offered once, alongside an unobstructed path to keep cancelling; then the journey waits for the decision and either executes the cancellation or records that the intent lapsed with the relationship unchanged."
  handoffs:
    - "RET-30 - a retention alternative offered at the decision point."
    - "SUB-167 - cancellation confirmed by the customer, for execution."

classification:
  journey_types:
    - communication
    - handoff
    - multi-branch
    - nested-decision
    - no-deadline
    - shared-exit
    - wait-event-timeout

