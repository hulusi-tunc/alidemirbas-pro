journey_id: DOC-215
slug: signature-process
status: audited

story:
  trigger: "A document version requires signature, with its required signers, their signing authority and any signing order defined (authoritative)."
  entity: "The document version, the signature process against it, and each required signer. Signatures never carry to a successor version."
  objective: "Collect every required signature on one exact document version, remind outstanding signers once while a reminder can still change the outcome, and end honestly."
  success: "All required signatures complete on the governed version -> h.effective -> DOC-216."
  summary: "A signature request is issued against one exact version, with a validity window only where one genuinely exists. Signatures accumulate against that version; outstanding signers get exactly one reminder; and the process ends as fully signed, declined, superseded or expired - never by inventing a deadline nobody agreed to."
  non_success_endings:
    - "x.superseded (invalid-state): the version the process was bound to is no longer current; outstanding requests are suppressed and collected signatures do not carry over"
    - "x.expired (timeout): SIGNATURE_EXPIRED - the request lapsed, nobody declined, and the signatures collected remain evidence of an incomplete set"
  handoffs:
    - "h.effective -> DOC-216 when all required signatures are complete"
    - "h.declined -> external:operational-resolution when a required signer refuses"
  business_decisions:
    - "c.event - what happened: a required signer signed the governed version, a signer declined, or the version was superseded"
    - "c.complete - are all required signatures now complete, or do some remain (the loop that makes this a multi-signer process rather than a single signature)"
    - "c.reminder-useful - would a reminder still change anything (one reminder per signer is a stated rule, so this is business-visible even though it is structurally a sendability gate)"
  implementation_checks:
    - "c.window - 'is a signature validity window defined?'; both arms record something and both reach a.request, so it is a housekeeping fork, not a fork in the story"
  bookkeeping_nodes:
    - "a.define - defines signers, authority, order, scope and window; entry setup that belongs on the trigger card"
    - "a.bounded - records the window as defined (the only card under 110 chars of the eight)"
    - "a.unbounded - records that no expiry was set rather than assigning one"
    - "a.record-sig - records the signature evidence; its content is what c.complete then counts"
    - "a.fully-signed - records FULLY_SIGNED; its content is the h.effective handoff"
    - "a.declined - records DECLINED; its content is the h.declined handoff"
    - "a.superseded - ends the process and suppresses outstanding requests; its content is the x.superseded exit"
    - "a.expired - records SIGNATURE_EXPIRED; its content is the x.expired exit"
  read_as_one_action:
    - "c.window + a.bounded + a.unbounded + a.request as one 'request signature against this exact version (with or without a stated expiry)' card"
    - "a.record-sig + c.complete as one 'signature recorded - all in?' checkpoint"
    - "a.fully-signed + h.effective, a.declined + h.declined, a.superseded + x.superseded, a.expired + x.expired - four record-then-end pairs that are four endings, not eight cards"
  must_stay_visible:
    - "h.effective (the success)"
    - "h.declined (a decline is a business outcome, not a failure)"
    - "x.superseded"
    - "x.expired"

