planned_changes:
  - "Highest internal load in the slice: 8 of 21 canonical nodes are execution:null actions and 7 of them draw over 110 characters. Four of them (a.fully-signed, a.declined, a.superseded, a.expired) are pure record-then-end pairs - P-RECORD-01 removes four cards and loses nothing, because the state each writes is the ending's own name."
  - "c.window -> a.bounded / a.unbounded -> a.request is the second clean P-FORK-NOOP-01 instance in the slice: a condition whose every arm converges on the same next node through one plain-internal hop. Draw one request card; keep the 'no invented deadline' rule in its detail, since it is a stated guardrail."
  - "Fold c.event into the two waits that are its only parents (P-WAITARM-01): its three branches are exactly their three until-events (signer_signed, signer_declined, document_version_superseded)."
  - "Draw c.complete's 'Some remain' arm back to w.signatures as one labelled return edge (P-LOOP-01) - it is what makes multi-signer collection visible in one picture."
  - "'A required signer signed the correct version' (44 chars) is the longest branch label measured in the slice; shorten to 'Signed' with the authority/version test in the detail (P-LABEL-01)."
  - "w.expiry's timeout is authored as prose ('validity_ends_at where defined, otherwise the process's recorded review point') - the wait card must render a short form and keep the prose in the detail panel."

