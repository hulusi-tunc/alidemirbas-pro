journey_id: ACQ-12
slug: abandoned-selection-recovery
status: audited

story:
  trigger: "A person put items in a cart, basket or saved list and did not carry them into a process (selection_recorded)."
  entity: "The recorded selection - the set of items held by one person - keyed on person_id + selection_id, one active instance per key."
  objective: "Bring the person back to the selection as it currently stands and let them act on it, without asserting reserved stock, a held price, a discount or an expiry the system does not hold."
  success: "x.converted - an order including at least one item from the selection is recorded, by any channel."
  summary: "A selection is recorded and left alone; after a short settle the journey re-reads what the selection is now and, if it still stands with something available, sends the person back to it. It does that at most twice, re-reading the selection before every touch, and stops the moment the selection converts, is cleared, goes unavailable or is carried into a real process."
  handoffs:
    - "h.process -> ACQ-11 Abandoned Process Recovery, the moment a process is started from the selection: the process owns recovery from then on and this instance's queued touches are suppressed."

classification:
