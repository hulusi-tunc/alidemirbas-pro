planned_changes:
  - "Hide the three execution:null bookkeeping actions. a.open (open the instance, start the clock) and a.record-no-action (record which gate stopped the touch) are already absorbed by the shipped gate collapse; a.rearm is the only Internal card still drawn and it is also the journey's only long card (174 chars EN / 185 TR)."
  - "P-LOOP-01: a.rearm is a back edge into w.settle. Hide the card but keep the edge and carry the c.state branch label 'Changed, still held' onto it, so 'the person is still editing, so wait again' stays visible as a loop."
  - "P-GATE-01/P-GATE-02: c.eligible, c.sendable and c.sendable2 are permission/sendability gates whose short arm is the shared no-action exit. They are already collapsed by the shipped rule; keep them collapsed and keep x.no-action pruned."
  - "P-STATE-01: c.state 'Still held' leads straight into c.availability 'Can any of it still be acted on?'. The two together answer one business question - what is the selection now - and should read as one state check whose arms include 'nothing available'."
  - "P-RECHECK-01: c.state, c.state2 and c.state3 are the same re-read at three stages and fan out to the same four endings (converted / cleared / carried into a process / unavailable-or-lapsed). Each checkpoint's exit arms should compact into one ending cluster per checkpoint instead of three or four separate exit cards; the handoff keeps its own card."
  - "P-WAIT-01: w.settle, w.second and w.final each route onEvent and onTimeout to the same node. Drop the 'event'/'timeout' edge labels on all three - they are the only waits in this slice with that shape."
  - "P-DETAIL-01: a.rearm's bounded-retry prose and the send-path prose inside c.sendable's branches belong in the detail panel, not on cards."

