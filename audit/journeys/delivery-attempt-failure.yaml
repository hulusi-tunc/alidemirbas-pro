journey_id: FUL-148
slug: delivery-attempt-failure
status: audited

story:
  trigger: "An executor authoritatively reported that a delivery attempt failed (authoritative_delivery_attempt_failure)."
  entity: "The individual delivery attempt and the obligation it was serving."
  objective: "Recover the delivery according to why it actually failed, inside a bounded attempt budget, without re-delivering to somebody who already refused and without moving where somebody must be present unless policy or the recipient allows it."
  success: "h.retry -> FUL-147, a further attempt dispatched on the original route or an authorised alternative."
  summary: "A delivery fails and the reported failure class decides everything: a wrong or blocked destination asks the recipient for the exact correction, a refusal or damage leaves immediately, and anything reattemptable is checked against the attempt budget. Where a different route would serve better, policy either authorises the change or the recipient is asked to choose it - and either way the attempt budget does not reset."
  handoffs:
    - "h.retry -> FUL-147, a further delivery attempt being dispatched (reached from the authorised alternative route and from the bounded reattempt)."
    - "h.return -> REM-151, a delivery that cannot be completed: refused, uncorrectable, out of attempts, or every offered route declined."
    - "h.exception -> FUL-145, an item that arrived damaged."

