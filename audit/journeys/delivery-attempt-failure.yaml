planned_changes:
  - "P-READ-01: a.classify is the only pure-bookkeeping internal here (execution:null, single edge into c.class, reads the executor's reported class). It is also the longest card in the slice at 284 chars EN / 294 TR. Fold it into c.class and move the refused-versus-unavailable reasoning to the detail panel."
  - "Do NOT hide a.alternate and a.reattempt even though both are execution:null and both step into h.retry. They are the two different recovery acts this journey exists to choose between - 'take the authorised alternative route' versus 'schedule the bounded reattempt against the remaining budget' - and the handoff card behind them is identical, so hiding them would erase the only place the difference is stated."
  - "P-LABEL-01 is the priority fix: four branch labels run 30-61 characters ('An alternative is better, but it is the recipient's to choose' at 61, 'A reattempt is safe / No usable reason given' merged at 44). Shorten to the business form on the edge and keep the authored 'when' clause in the panel."
  - "P-TERM-01: h.return has four parents (c.class, w.correction timeout, c.budget, c.route-answer) and h.retry has two. Keep drawing them as local instances - the four routes to 'this cannot be delivered' are four different stories and a single shared box would turn the canvas into a hub."
  - "P-MERGE-01: c.class routes two different arms ('A reattempt is safe', 'No usable reason given') into c.budget; centre that merge."
  - "w.correction's timeout arm goes to h.return while its event arm goes to c.budget, so P-WAIT-01 does not apply - both edge labels carry meaning and must stay."

