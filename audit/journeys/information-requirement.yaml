journey_id: DEC-184
slug: information-requirement
status: audited

story:
  trigger: "A reviewer identified a specific fact the decision turns on that is not available."
  entity: "The decision case and the specific information requirement blocking it - not a general data-completeness exercise."
  objective: "Pause the decision for the fact it is actually missing, collect exactly that, revalidate it, and resume the review without losing what has already been established."
  success: "h.resume -> DEC-183: the requirement is satisfied, or exhausted under policy, and the review continues from where it paused."
  summary: "The missing fact is named precisely and the case is paused rather than reset; the request goes to whoever actually holds it - the requester on a customer channel, or an internal owner as owned work. What arrives is validated for relevance rather than counted, and an expired deadline is resolved by what policy actually says rather than by a default closure."
  non_success_endings:
    - "x.moot (invalid-state): the request was withdrawn or the thing it was about no longer exists - not a rejection and not an approval"
    - "x.closed-noinfo (timeout): policy explicitly closes an unanswered case; it closed for want of information, not on its merits"
  handoffs:
    - "h.resume -> DEC-183 when the requirement is met, partly met with no further round allowed, or policy permits deciding on what is available"
    - "h.escalate -> DEC-189 when the deadline expires and policy escalates or defines nothing"
  business_decisions:
    - "c.source-type - who actually holds the information: an external party (a message) or someone inside the organisation (owned work). This is the human-vs-automated split and the journey's central rule"
    - "c.complete - does what arrived satisfy the requirement, relevantly and completely"
    - "c.timeout - what policy defines for an expired deadline: decide on what is available, close, or escalate"
  implementation_checks:
    - "c.further - 'does policy allow requesting the remainder?' is a request-budget gate; its loop back to c.source-type is retry plumbing, its other arm is the same h.resume the satisfied path reaches"
  bookkeeping_nodes:
    - "a.specify - names the exact requirement; belongs on the trigger card as what was identified"
    - "a.state - records AWAITING_INFORMATION and preserves the review; a pure state write (264 chars)"
    - "a.validate - 'validate what arrived for relevance and completeness' is c.complete's own question"
    - "a.deadline - 'apply the timeout semantics policy defines' is c.timeout's own question (328 chars, the longest card in the slice)"
    - "a.moot - records the case as no longer requiring a decision; its content is the x.moot exit"
    - "a.close - closes under policy's stated semantics; its content is the x.closed-noinfo exit"
  read_as_one_action:
    - "a.specify + a.state + the trigger as one 'requirement identified, case paused' entry card"
    - "a.request / a.request-internal each with w.info - one 'ask, then wait' per holder"
    - "a.moot + x.moot, and a.close + x.closed-noinfo, each as one ending card"
  must_stay_visible:
    - "x.moot and x.closed-noinfo - two distinct non-decisions that must not read as rejections"
    - "h.resume (the success, reached three ways - one compact instance per parent)"
    - "h.escalate"

classification:
  journey_types:
    - back-edge-retry
    - communication
    - deadline-driven
    - handoff
    - human-vs-automated
    - multi-branch
    - nested-decision
    - recovery
    - routing-heavy
    - shared-handoff
    - wait-event-timeout

