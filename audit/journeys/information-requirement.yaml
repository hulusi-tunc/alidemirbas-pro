planned_changes:
  - "This is the worst case in the slice: 6 of 19 canonical nodes are execution:null actions and every one of them draws a card over 110 characters. None of them needs a box - two are setup, two are classifiers for the condition that follows, two are the record written by the exit that follows."
  - "P-RECORD-01: a.moot -> x.moot and a.close -> x.closed-noinfo are 'write the state, then exit'; the exit card carries the recorded state and the internal node draws nothing."
  - "Fold c.received into w.info (P-WAITARM-01) - its two branches are exactly w.info's two until-events (requested_information_received, request_withdrawn)."
  - "Draw c.further's return to c.source-type as one labelled back edge ('another round allowed') rather than a second pass of the request lane (P-LOOP-01)."
  - "Seven branch labels run 27-39 chars; they are sentences, not labels (P-LABEL-01)."

