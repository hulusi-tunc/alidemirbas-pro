journey_id: INT-278
slug: integration-setup-outcome
status: audited

story:
  trigger: "An integration connection attempt resolves (it either passed every stage or failed at one)."
  entity: "The single connection attempt and the integration it configures."
  objective: "Tell the person who started a connection which stage it actually failed at and what would fix that stage - a generic failure sends a capable person to support and an incapable one away for good."
  success: "The connection is recorded active and the message names the capabilities that were actually validated rather than the ones that were configured (x.active)."
  summary: "A resolved connection attempt is sorted three ways: active, failed at an authoritatively named stage, or failed with no stage identified. A named stage produces a targeted fix message - credential, permission, or capability probe - and the journey waits for the next attempt; a later attempt that clears the named stage and fails at a new one routes back to the stage message rather than repeating the one already sent. An unidentified failure says so honestly and hands off to diagnosis rather than inventing a cause."
  handoffs:
    - "INT-111 - a failed connection attempt with no stage authoritatively identified."

