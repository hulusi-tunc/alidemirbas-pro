planned_changes:
  - "P-RECORD-01 is the whole story here: all three execution:null actions (a.stop-permission, a.stop-contactability, a.sunset) do nothing but write a record and step into an exit, and all three are the journey's long cards (151-235 chars EN, up to 247 TR). Hide the card, point the incoming edge at the exit, move the prose to the exit's detail panel. That removes 6 of the 6 measured Internal cards and all of the long text in one rule."
  - "The three exits they feed (x.permission-ended, x.unreachable, x.sunset) must stay drawn and must keep their distinct classes - suppression, suppression, timeout - because 'permission went away', 'the route went away' and 'the window ran out' are three different endings a reader has to be able to tell apart."
  - "P-GATE-01: c.basis is a lawful-basis permission gate short-circuiting to x.no-basis (class no-action) and is already collapsed by the shipped rule. Leave it collapsed - but note its EN prose ('submitting a form is not consent') is worth keeping reachable in the trigger's detail panel, since the ordinary case is that no basis exists."
  - "P-LABEL-01: keep c.window-event's arms as authored ('They progressed', 'Permission withdrawn', 'Route lost') - they are already the business-readable form."

