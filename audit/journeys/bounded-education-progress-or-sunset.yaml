journey_id: ACQ-09
slug: bounded-education-progress-or-sunset
status: audited

story:
  trigger: "A lead is valid but not ready for the destination it was captured for (valid_lead_not_destination_ready)."
  entity: "The lead or person, held against the reason they entered."
  objective: "Give a legitimate but not-yet-ready lead a bounded window of education matched to why they came, and end the window whether or not it worked."
  success: "h.progressed - a progression signal strong enough to change what the person needs, handed to ACQ-03."
  summary: "A lead arrives too early to sell to. If there is an explicit lawful basis, the journey sends education matched to the reason they entered and then waits out one bounded window. It ends on progression (handed on), on permission or deliverability being lost, or on the window closing - and sunset is recorded as a fact about the attempt, not a verdict on the person."
  handoffs:
    - "h.progressed -> ACQ-03, on a progression signal strong enough to change what this person needs."

