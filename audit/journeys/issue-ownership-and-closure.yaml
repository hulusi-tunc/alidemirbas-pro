planned_changes:
  - "Merge a.capture forward into c.owner (P-CHECK-01) and merge a.close into x.closed and a.close-unconfirmed into x.closed-unconfirmed (P-RECORD-01). That removes three Internal cards including the 362/390-char one, and turns the two exits into the merge points they actually are (P-TERM-01, one instance per parent)."
  - "Merge w.confirm and c.confirmed into one card (P-WAIT-02): the wait's until events (resolution_confirmed, resolution_disputed) are c.confirmed's two branches."
  - "Group c.confirmation + c.confirm-route into one decision (P-STATE-01): 'does closure need their confirmation, and is there a permitted route to ask?' is one business question with three outcomes - ask, close, close unconfirmed. The permission gate is not a second decision a reader needs."
  - "Draw the two back edges into w.resolution (c.levels 'Levels remain', c.confirmed 'Still not right') as labelled return arcs carrying their bound (P-RETRY-01); w.resolution has three parents and needs centring (P-MERGE-01)."
  - "Keep a.assign and a.escalate visible - both are execution:human, and the escalation ladder is a stated business behaviour, not plumbing."

