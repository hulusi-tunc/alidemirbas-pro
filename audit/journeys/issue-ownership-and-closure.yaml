journey_id: FBK-46
slug: issue-ownership-and-closure
status: audited

story:
  trigger: "An actionable issue or complaint is created with type, severity, related entity, SLA and source (actionable_issue_created)."
  entity: "The issue itself (issue_id). The feedback that produced it, the person it affects and the case are three separate records; closing the issue closes none of them."
  objective: "Own an actionable issue from creation to closure: assign it, escalate it up a bounded ladder when its SLA is missed, and close it only against the fix that was actually performed."
  success: "The issue is closed against a real fix - confirmed by the person where a permitted route to ask them exists (x.closed), or closed under the bounded closure rule with 'unconfirmed' recorded as itself rather than as silence (x.closed-unconfirmed)."
  summary: "An issue is captured, given a named owner, and held open until the fix completes; a missed SLA walks an internal escalation ladder and nothing customer-facing is sent because of it. When the fix lands, the journey decides whether closure needs the person's confirmation and whether there is a permitted route to ask - asking where it can, closing unconfirmed where it cannot, and reopening the work when they say the problem persists."
  handoffs:
    - "OWN-51 - an issue with no determinable owner"
    - "external:human-in-the-loop-lifecycle - an issue outliving its escalation ladder"

classification:
  journey_types:
    - back-edge-retry
    - communication
    - external-handoff
    - handoff
    - human-vs-automated
    - multi-branch
    - nested-decision
    - no-deadline
    - wait-event-timeout

