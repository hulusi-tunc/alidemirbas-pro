journey_id: FUL-265
slug: dispatch-to-acceptance
status: audited

story:
  trigger: "An obligation is handed to a delivery executor (it has left our hands)."
  entity: "The dispatched obligation, its recipient, and the acceptance window running against it."
  objective: "Carry the recipient from dispatch to the moment they agree the obligation was discharged correctly - because arriving and being agreed to have arrived correctly are two different facts, and only one of them has the recipient as its source."
  success: "The recipient explicitly confirms it arrived correctly (x.accepted), or - where policy defines no acceptance window - delivery itself is the end of it (x.delivered)."
  summary: "On dispatch the recipient is told it is on its way with an honest reference or an honest absence of one, then the journey waits for the executor's authoritative report. A non-arrival is named as either a confirmed failure or a lost executor and handed to recovery; an arrival is confirmed with its evidence. Where acceptance carries a consequence, the recipient is asked to accept or raise an issue by a stated date, and silence after that date is recorded as acceptance-by-expiry, kept distinguishable from acceptance by agreement."
  handoffs:
    - "FUL-148 - a confirmed non-arrival, or an executor gone quiet long enough that the obligation needs active recovery."
    - "FUL-149 - a delivered obligation the recipient has raised an issue against inside its acceptance window."

