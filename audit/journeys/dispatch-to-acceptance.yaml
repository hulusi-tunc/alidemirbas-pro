  - "Clamp the a.finalize lead sentence - its first sentence alone exceeds the 110-char card budget - P-DETAIL-03."
  - "Merge a.no-arrival with the FUL-148 handoff it leads into (one parent), keeping the handoff target named on the card - P-TERM-02 / P-HANDOFF-01. Note the canonical node id x.unresolved is authored as kind handoff, so the display must read the kind, not the id prefix."
