journey_id: TIM-268
slug: outstanding-obligation-reminder
status: audited

story:
  trigger: "An authoritative record shows a defined action owed by a named person, with a due date."
  entity: "The outstanding obligation, its owner and its due date (obligation_id)."
  objective: "Remind somebody of what they owe while there is still time to do it, built from the state the obligation is in at the moment of sending."
  success: "The obligation is discharged in full and the confirmation says nothing further is expected."
  summary: "An obligation with time left waits until its reminder point, then is re-read from authoritative state: anything already settled stops silently, anything still owed gets one reminder naming what remains and the single way to discharge it. A deadline passed unmet gets one overdue notice, and a defined consequence takes ownership from there."
  handoffs:
    - "external:consequence-owner - an obligation outstanding past its deadline with a defined consequence attached"

