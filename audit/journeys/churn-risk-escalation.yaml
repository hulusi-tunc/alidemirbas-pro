journey_id: RET-24
slug: churn-risk-escalation
status: audited

story:
  trigger: "A churn-risk threshold was crossed on a relationship (churn_risk_threshold_crossed)."
  entity: "The customer, account or subscription relationship at risk."
  objective: "Match the size of the response to the strength of the evidence: hand off where a cause or an intent already exists, put a person on it only where corroborated evidence justifies the cost, and otherwise do the proportionate small thing or nothing."
  success: "h.human - a person takes ownership of a corroborated risk, carrying the evidence rather than the score, with automated retention suppressed behind them."
  summary: "Risk crosses a threshold and the journey asks, in order, whether the customer has already said they are leaving, whether something identifiable is broken, and whether the evidence is strong enough to justify a human. Strong corroborated evidence raises an owner task and suppresses automated retention; thin evidence gets a proportionate automated intervention if one exists, and nothing at all if it does not."
  handoffs:
    - "h.cancellation -> RET-28, when cancellation intent is already on record - there is nothing to infer."
    - "h.resolve-first -> RET-23, when the risk has an identifiable operational cause that is not a payment failure already owned by payment recovery."
    - "h.human -> external:human-in-the-loop-lifecycle, when the evidence justifies a person."
    - "h.intervention -> RET-30, when a proportionate automated retention intervention exists."

classification:
  journey_types:
    - external-handoff
    - handoff
    - human-vs-automated
    - multi-branch
    - nested-decision
    - shared-exit

