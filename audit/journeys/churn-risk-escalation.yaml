planned_changes:
  - "P0 - the shipped gate collapse currently erases a business decision. c.automated ('Is a proportionate automated recovery available?') is a binary condition whose negative arm reaches x.monitor, class no-action, so collapsibleGates hides it and retargets the edge straight at h.intervention. x.monitor then becomes unreachable and is pruned, so the canvas today shows NO 'nothing proportionate to do' ending at all and implies every thin-evidence case gets an intervention. That contradicts the journey's own authored rule s.g4 ('the size of the intervention tracks the strength of the evidence'). Add a guard to the gate rule: never collapse a gate whose short arm is the journey's only exit, and never collapse one whose short arm corresponds to an authored suppressions entry."
  - "P-GATE-01 does legitimately apply to c.priority-clear ('does a higher-precedence contender already claim this account?') - that is a precedence/contention gate, not a business decision, and it should stay collapsed into a.owner-task."
  - "P-READ-01: a.evidence (execution:null, single edge into c.operational) only assembles signals with their sources; it is also the journey's longest card at 215 chars. Fold it into c.operational as a 'reads' caption with the full prose in the detail panel."
  - "P-DETAIL-01: c.operational's question is 121 characters on the card ('Is the risk driven by a known operational problem, other than a payment failure already open in payment recovery?'). The card should ask the short question and keep the payment-recovery carve-out in the panel."
  - "P-TERM-01: x.monitor has two parents (c.priority-clear, c.automated). Once the guard above keeps c.automated visible, draw x.monitor as a local instance per parent; the two reasons for it are different and should not be one shared box."
  - "This is the only journey in the slice whose sole exit is a no-action exit, which is exactly why the no-action heuristic misfires here."

