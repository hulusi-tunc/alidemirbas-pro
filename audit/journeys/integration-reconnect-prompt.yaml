planned_changes:
  - "P-READ-01: a.unreconnected is the only execution:null node and the only long card - 309 chars EN and 345 TR, the worst single card in the slice. It has one edge into c.relationship-signal and does nothing but record a dated fact, so it folds into that decision with the 'one signal is not a conclusion' reasoning in the panel."
  - "P-MERGE-01: a.inform-only has two parents (c.fixable 'Not theirs' and c.outcome 'Not theirs after all'). Centre that merge - the same message is correctly reached two ways and the canvas should show that rather than duplicating the card."
  - "Everything else stays: c.fixable, c.scope, c.outcome and c.relationship-signal are four genuine business decisions, and the three communication actions (inform-only, partial, total) differ in exactly the way the journey exists to make visible."
  - "P-EXIT-01: four exits with three distinct classes (two success, one invalid-state, one timeout) - the compact exit must keep the class distinction, because 'informed, nothing you could do' and 'reconnected and confirmed' are both successes for very different reasons."
