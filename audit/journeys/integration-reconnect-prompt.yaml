journey_id: INT-269
slug: integration-reconnect-prompt
status: audited

story:
  trigger: "A connection to an external provider failed or was deauthorised (integration_connection_failed_or_deauthorized)."
  entity: "One connection to one external provider, plus the failure recorded against it."
  objective: "Tell the holder of a broken connection which of their capabilities stopped, whether the fix is theirs to perform, and the single step that restores it - so a silent dependency failure becomes a decision instead of a slow discovery."
  success: "x.restored (reconnected and confirmed) and x.informed (told, with no step attached, because no holder action would work)."
  summary: "A connection breaks and the first question is whether the holder can fix it at all; if not they are told what stopped and explicitly that nothing is required of them. If they can, they are told exactly which capabilities stopped - partial or total - and given one re-authorisation step. The window then ends in a confirmed reconnection, a deliberate removal, a reclassification, or an unreconnected connection that only becomes a relationship signal when something else already corroborates it."
  handoffs:
    - "h.abandoned -> RET-24 Churn Risk Escalation, only when independent risk evidence already exists against the relationship - the unreconnected integration adds to a picture rather than being the whole of it."

