journey_id: SUB-262
slug: cancellation-wind-down-notice
status: audited

story:
  trigger: "A cancellation is authoritatively recorded against a relationship, with an effective end date (cancellation_confirmed)."
  entity: "The cancelled relationship plus its effective end date (relationship_id, one active per key)."
  objective: "Carry somebody through the gap between deciding to leave and actually losing access, so the end date is never a surprise and returning stays possible right up to it."
  success: "Access ends on the stated date with nothing outstanding (x.ended) - or the person withdraws the cancellation and the relationship continues (x.returned), which the journey treats as a legitimate stop, not a failure."
  summary: "The cancellation is confirmed with the exact end date and what stays available until then. If a meaningful window remains, the journey waits: a withdrawal ends it immediately, otherwise a second message says what will and will not survive the end date. Anything that outlives the relationship - a balance, a return, a retention period - hands to SUB-170."
  handoffs:
    - "SUB-170 - a cancelled relationship with obligations continuing past its end"

