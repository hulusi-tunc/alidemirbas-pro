planned_changes:
  - "Merge w.window and c.withdrawn into one card (P-WAIT-02): the wait's until list is [cancellation_withdrawn, effective_end_reached] and c.withdrawn's two branches are exactly those two events. 'What ended the wait?' is the wait, not a decision after it."
  - "Centre the c.obligations merge (reached from a.ending and from c.window's 'Ends immediately' arm) and the a.ending merge (P-MERGE-01)."
  - "Keep c.window drawn but as a light-weight branch: it changes whether a second message is sent at all, which the reader can see from the shape - the card itself can carry just the question."
  - "Keep x.returned visible. It is classed invalid-state but it is the good outcome of a withdrawal, and no collapse rule should absorb it."

