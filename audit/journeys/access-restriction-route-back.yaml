planned_changes:
  - "Merge w.resolve with c.outcome (its sole successor on both the event and the timeout arm) into one 'wait for the restriction to resolve' card carrying the two business branches - P-WAITRES-01."
  - "Because w.resolve.onEvent === w.resolve.onTimeout, suppress the 'on event' / 'on timeout' edge labels entirely rather than drawing two parallel labelled edges - P-WAIT-01."
  - "Merge each terminal message with the ending it leads to where that ending has one parent: a.inform-only+x.informed, a.confirm+x.restored - P-TERM-02."
  - "Demote c.reachable ('Is there a permitted route to them?') from a decision diamond to a sendability chip on the a.notify card, with a single muted stub to the CON-36 handoff - P-GATE-01. The handoff itself must stay visible."
  - "Shorten the branch label 'Placed by a security response' on the canvas (29 chars) and keep the full authored `when` prose in the detail panel - P-LABEL-01."
  - "Keep all three branches of c.actionable drawn: 'resolvable by them' / 'not theirs to resolve' / 'already owned by the security response' are three genuinely different business paths with three different endings."

