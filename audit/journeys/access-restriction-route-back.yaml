journey_id: ACC-261
slug: access-restriction-route-back
status: audited

story:
  trigger: "An access restriction, suspension or end date is authoritatively recorded against an account."
  entity: "The account plus the one specific restriction placed on it (account_id + restriction_id); a second unrelated restriction is its own instance."
  objective: "Tell the account holder what access is going away, when, and the single condition that would bring it back, so a restriction is a decision they can act on rather than something they discover later."
  success: "Either the holder is told what still works and the one route back and the restriction is then lifted and confirmed (x.restored), or - where they cannot resolve it - they are informed with no false call to action (x.informed)."
  summary: "A recorded restriction is first sorted by whether the holder can actually do anything about it: if not, they get an inform-only notice; if a security response already owns the messaging, nothing is sent. Where it is theirs to fix and a permitted contact route exists, they are told exactly what stopped, what still works, the deadline and the single release condition, and the journey then waits for the restriction to resolve - confirming restoration explicitly or recording that the restriction stands past its deadline."
  handoffs:
    - "CON-36 - a restriction notice that cannot be delivered on any permitted route."

classification:
  journey_types:
    - communication
    - communication-heavy
    - deadline-driven
    - handoff
    - multi-branch
    - nested-decision
    - wait-event-timeout

