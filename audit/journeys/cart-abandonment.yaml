journey_id: ACQ-288
slug: cart-abandonment
status: audited

story:
  trigger: "An item is added to a cart and checkout is not started."
  entity: "One cart instance - its items and their current availability and price as the platform asserts them. A cleared-then-refilled cart is a new instance."
  objective: "Bring the person back to a cart that still stands, with a reminder cascade that escalates channel for the highest-value carts and never speaks once the purchase exists."
  success: "An authoritative purchase or order record exists that includes at least one item from this cart."
  summary: "After an item is added and checkout never starts, the journey waits, re-checks that the cart is still live and unpurchased, and sends up to two reminders - the second on a more direct channel when the cart is high-value. The moment checkout actually starts, ownership passes to Checkout Abandonment; if the cart is cleared or the cascade runs out, it ends as cleared or abandoned."
  handoffs:
    - "ACQ-287 - checkout started from this cart; Checkout Abandonment owns recovery from that moment"

