planned_changes:
  - "Collapse each of the three channel-selection actions into the message it routes (a.router1+a.reminder1, a.router2-hv+a.reminder2-hv, a.router2-std+a.reminder2-std): one communication card carrying primary and fallback channel."
  - "Collapse each pre-send condition stack into a single 'is this still worth sending?' check card that keeps its outcome chips - purchased, cleared, checkout started - as visible outcomes. Seven of the eight conditions are state re-checks; only c.highvalue is a business fork."
  - "The same check stack repeats after every wait; render it once per touch as a compact state check rather than three full three-diamond stacks."
  - "All three waits have onEvent and onTimeout pointing at the same node - drop the event/timeout edge labels and draw one edge."
  - "x.purchased (3 parents), x.cleared (2) and h.checkout (2) are shared terminals - draw a local instance per parent so no long edges cross the cascade."

