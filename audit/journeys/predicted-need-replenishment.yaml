journey_id: RET-31
slug: predicted-need-replenishment
status: audited

story:
  trigger: "Expected depletion of a consumable or recurring-use item is approaching, computed from the person's own purchase history and the item's usable life."
  entity: "The predicted need - one consumable or recurring-use item, or a category bought on a cadence, and the prediction cycle it belongs to."
  objective: "Get the replenishment made before the need bites, with the prediction stated honestly as an estimate and a direct route to reorder; never prompt a need already met, dismissed, or covered by a subscription."
  success: "A purchase of the need is recorded (x.replenished)."
  summary: "An approaching depletion is checked against what would make prompting wrong - a newer purchase, a subscription, a dismissal this cycle, an open instance, missing commercial permission - and only then opened as an instance timed against the estimated depletion date. Two touches at most follow: one before the estimated date and one after, each re-checking that the need is still unmet and that the send path is clear, with any suppression recorded as a measured no-action rather than a silent absence. The cycle ends replenished, dismissed, suppressed, or lapsed."
  handoffs: []

