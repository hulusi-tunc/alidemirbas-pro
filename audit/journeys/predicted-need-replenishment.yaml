planned_changes:
  - "Hide a.open (execution:null, writes replenishment_log - opening the instance against the prediction cycle is instance bookkeeping, not a beat in the story) and connect the eligibility decision straight through to the lead wait - P-INTERNAL-01. This is the 144-char card measured here; clamp its lead sentence in the detail panel - P-DETAIL-03."
  - "Hide a.record-no-action (execution:null, writes suppressed_sends) - it adds nothing the x.no-action exit does not already say - P-INTERNAL-01."
  - "c.sendable and c.sendable2 ('may this touch go out?') are pure send-path gates that already match the existing binary collapsibleGates shape (short arm reaches a class no-action exit through one internal hop) - keep them collapsed into a gate chip on the touch card they precede - P-GATE-01."
  - "c.eligible is a three-branch gate and must NOT collapse wholesale: its 'Already met' arm reaches x.replenished, class success, which is a real business ending. Collapse only the 'Not eligible' arm into a muted no-action stub and keep the eligible/already-met split drawn - P-GATE-03. Any rule that collapses n-ary gates must refuse to swallow a branch whose exit class is success, timeout or failure."
  - "Merge each of the three waits with the condition that classifies it (w.lead+c.state, w.window+c.outcome, w.final+c.final) into single wait-outcome cards - P-WAITRES-01."
  - "w.lead and w.window both have onEvent === onTimeout; suppress the duplicate event/timeout edge labels - P-WAIT-01."
  - "Draw the two-touch structure as one reminder ladder with the estimated depletion date on it rather than six alternating wait/gate/message boxes - P-LADDER-01."
  - "x.replenished has four parents and x.dismissed three; keep the per-parent terminal instancing so no single ending box collects lines from across the whole canvas - P-TERM-01."

