journey_id: DOC-286
slug: document-effective-notice
status: audited

story:
  trigger: "An authoritative record says a document version is now in force - the effective moment, not the signing moment."
  entity: "The effective document version and the entitlement it confers on its holder; a renewal or superseding version is its own instance."
  objective: "Tell the holder that what they signed has actually started, and name what it now lets them do."
  success: "The holder exercises the entitlement, or - where there is nothing to exercise - is told what now stands and why it matters."
  summary: "When a document takes effect, the journey says so once, in one of two registers: an entitlement the holder can act on names the single first action, while a standing protection names the moment at which it would matter. An actionable entitlement gets one reminder if it is still in force and still unused, and then the journey records whether it was exercised, went dormant, or was overtaken by the document ending first."
