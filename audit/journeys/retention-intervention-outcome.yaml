journey_id: RET-30
slug: retention-intervention-outcome
status: audited

story:
  trigger: "A defined retention intervention has actually been delivered - a plan alternative, a pause option, a support resolution, human outreach or an approved save offer (retention_intervention_delivered)."
  entity: "The customer, account or subscription plus the retention episode the intervention belongs to (account_id + retention_episode_id). The episode is the unit, which is what makes remembering a declined offer possible."
  objective: "Close a retention attempt on what actually happened to the relationship, and stop the same offer being made twice."
  success: "The outcome is read from the system of record rather than from the customer's answer: an accepted offer that actually applied hands to RET-27 as a positive outcome; an accepted offer that did not apply is never recorded as a retention success."
  summary: "After an intervention is delivered the journey waits for the relationship to move. Acceptance is verified against the record - accepted is not applied, and the gap between them is where retention numbers go wrong. A decline is remembered for the whole episode so the same offer is not repeated, and silence earns at most one bounded follow-up before a cooldown."
  handoffs:
    - "RET-27 - a retention outcome that looks positive"
    - "external:operational-resolution - an intervention that did not apply"
    - "SUB-167 - a declined save offer with cancellation continuing"

classification:
  journey_types:
    - communication
    - external-handoff
    - handoff
    - multi-branch
    - no-deadline
    - parallel-fan-out
    - shared-exit
    - shared-handoff
    - wait-event-timeout

