planned_changes:
  - "P0: the existing no-action gate collapse in collapsibleGates currently hides c.proceed AND x.declined (measured: 12 of 14 canonical nodes rendered). The canvas therefore shows every decline flowing into SUB-167 'cancellation continuing', which the canonical graph does not say. The qualifying signal - exit class 'no-action' - is wrong here: x.declined ('intervention declined, relationship intact') is a business ending, not a suppression record."
  - "Add the P-GATE-02 guard: a gate may only be absorbed when its continuation arm is a NON-TERMINAL node. c.proceed's continuation is h.proceed, a handoff - so both of its arms end the journey, which makes it a decision about how the journey ends, not plumbing. With that clause c.proceed and x.declined are drawn again."
  - "Merge w.outcome and c.outcome into one card (P-WAIT-02): the wait's four until events (accepted / declined / recovered / failed) are c.outcome's four branches one-for-one. This is the single biggest readability win here - four business outcomes fan out of the wait itself."
  - "Merge a.verify forward into c.applied (P-CHECK-01) so the 316-char 'verify against the system of record' card becomes the subtitle of 'did the state actually change?'."
  - "Shorten 'Recovered without answering' (27) on the demuxed wait edge (P-LABEL-01)."
  - "Keep a.record-decline visible - remembering the decline for the whole episode is a stated canonical rule and the reason c.proceed exists."
  - "Three terminals have two parents each (P-TERM-01, P-HANDOFF-01): draw one instance per parent rather than six crossing edges."

