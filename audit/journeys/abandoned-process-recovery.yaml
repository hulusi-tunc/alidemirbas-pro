planned_changes:
  - "Keep the existing gate collapse (c.eligible, c.sendable, c.sendable2 already draw no box) but surface the absorbed gate reason in the touch card's detail, so 'nothing was sent because X' is still findable."
  - "Fold each wait's follower condition into the wait card (P-WAITARM-01): w.abandon/w.second/w.final each have exactly one condition parented only by waits, and the branch count equals the wait's until-event count."
  - "The four 'what is the process now?' re-checks should render as one recognisable checkpoint form (P-RECHECK-01) with identical compact exits, not four different-looking decision cards."
  - "Shorten the repeated 29-char branch labels ('Cancelled, expired or emptied' -> 'Cancelled'; 'Disabled, or no honest expiry' -> 'No honest expiry') - P-LABEL-01."
  - "a.note-return's 196-char EN / 215-char TR card is the longest text in this journey; if it keeps a box at all it needs a one-line summary with the prose in the detail panel (P-DETAIL-01)."
  - "Draw a.note-return -> w.resumed -> c.state2 as a single labelled return edge rather than a second lane (P-LOOP-01)."

