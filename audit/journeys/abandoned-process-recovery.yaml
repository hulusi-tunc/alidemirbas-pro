journey_id: ACQ-11
slug: abandoned-process-recovery
status: audited

story:
  trigger: "A person started a resumable process - a basket and checkout, an application, a quote, a registration - and did not finish it."
  entity: "The logical process itself (one open instance per person and logical process), not the platform's rotating identifier for it."
  objective: "Bring the person back to that exact unfinished process while it is still resumable, claiming nothing the system does not assert - no held stock, no held price, no invented discount."
  success: "The process is completed by any channel (x.converted). A completion recorded in a store or by phone counts and stops the cascade."
  summary: "A started-and-abandoned process is watched from its last activity; up to three progressively different touches point back at the same resumable process, each one re-reading the process state first. It ends the moment the process completes, is cancelled or expired, is superseded by a newer process, or hits a payment failure - which belongs to a different journey."
  non_success_endings:
    - "x.invalid (invalid-state): cancelled, expired or emptied - nothing further is sent"
    - "x.superseded (suppression): a newer process for the same person outranks this one"
    - "x.lapsed (timeout): the recovery lifetime passed, or no honest expiry exists to name in a final notice"
    - "x.no-action: a permission, deliverability, pressure-cap or contest gate stopped the touch; the gate is recorded"
  handoffs:
    - "h.payment -> FIN-134 when a payment failure is recorded against the process"
  business_decisions:
    - "c.state / c.state2 / c.state3 / c.close - 'what is the process now?', the re-read that decides send vs stop (the same question asked once per stage)"
    - "c.final-enabled - is a final notice enabled AND is there a real expiry to name; its short side is x.lapsed (timeout), a business ending, not a no-action record"
  implementation_checks:
    - "c.eligible - entry plumbing: contactable identity, resumable process, no open instance, no payment failure, permission recorded"
    - "c.sendable - 'may the first touch go out?' (permission, deliverability, pressure cap, contest, cooldown)"
    - "c.sendable2 - the same send-path gate before the second touch"
  bookkeeping_nodes:
    - "a.open - opens the instance and starts the abandonment clock; instance bookkeeping that belongs on the trigger card"
    - "a.record-no-action - writes which gate stopped the touch; its whole content is the x.no-action exit"
    - "a.note-return - logs the return and re-arms one wait; the branch label 'Resumed, still open' and w.resumed already tell the reader this"
  read_as_one_action:
    - "Each touch action (a.touch1 / a.touch2 / a.touch3) with the sendable gate in front of it - one 'send touch N' card whose detail carries the gate and the declared channel roles (low-friction -> persistent -> urgent)"
    - "Each wait and the state re-check that follows it (w.abandon+c.state, w.second+c.state2, w.final+c.state3) - the wait's arms ARE the branches"
  must_stay_visible:
    - "x.converted (the only success)"
    - "x.invalid"
    - "x.superseded"
    - "x.lapsed"
    - "h.payment -> FIN-134 (the payment/abandonment boundary is a stated rule of this journey)"

classification:
  journey_types:
    - back-edge-retry
    - communication
    - communication-heavy
    - deadline-driven
