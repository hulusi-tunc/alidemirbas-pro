planned_changes:
  - "P-READ-01: a.reread (execution:null, single edge into c.superseded) is the only Internal node and the only long card, 266 chars EN / 275 TR. Fold it into c.superseded."
  - "P-STATE-01 rather than a hide: the re-read and c.superseded together answer one question - 'did the booking genuinely not happen?' - so they should read as one state check on the canvas, with the late-landing-events reasoning in the panel."
  - "P-GATE-02 with the suppression guard: c.superseded is structurally an entry suppression gate, but its short arm x.suppressed is an authored business rule of this journey (do not accuse somebody who actually cancelled) and the purpose statement leads with it. Group it, do not hide it - and hiding is blocked anyway because the exit's class is suppression, not no-action."
  - "P-TERM-01: x.closed has three parents (a.acknowledge, w.rebook timeout, c.outcome 'Declined'). Keep local instances - 'nothing to book onto', 'no answer' and 'they said no' are three different closes."
  - "c.provider and c.rebookable are the two real business decisions and must stay visible; c.outcome is the wait's resolution and stays too."

