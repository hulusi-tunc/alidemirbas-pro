journey_id: SCH-280
slug: no-show-rebooking
status: audited

story:
  trigger: "A no-show was recorded against a booking (no_show_recorded_against_booking)."
  entity: "The single booking occurrence that did not take place."
  objective: "After a genuinely missed booking, state the fact without penalty language and give the one route to a new booking where one exists - never where our own side could not have delivered."
  success: "x.rebooked - a new booking exists against the same commitment."
  summary: "A booking is marked missed, and before anything leaves the building the record is re-read, because attendance and cancellation events land late. If the miss is genuine and our own provider could actually have delivered, the person gets the fact without blame plus the single route to a new booking; if there is nothing to book onto they are told that plainly instead of being offered something empty."
  handoffs:
    - "h.provider -> SCH-180, a missed booking the provider, resource or location could not have delivered as confirmed - a rebooking prompt over our own failure would be an accusation."

