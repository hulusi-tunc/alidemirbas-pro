journey_id: ACQ-285
slug: captured-interest-first-touch
status: audited

story:
  trigger: "A first-party capture records a declared interest with a contact point and, separately, a permission position."
  entity: "The individual capture and what it asked for, resolved onto a person (capture_id)."
  objective: "Answer a declared interest with the thing that interest actually asked for, and carry it onward only as far as what the person said about themselves justifies."
  success: "What was asked for is delivered once - material sent, or a person promised with a named time - and anything past fulfilment travels only on recorded permission."
  summary: "A capture is checked for a usable destination, then read for what it declared: a request only a person can answer goes to sales assignment, a request for material is fulfilled once. Continuing contact happens only where permission was recorded as its own fact, as a bounded sequence that states its end when it opens."
  handoffs:
    - "external:sales-assignment - a captured interest whose declared request can only be answered by a person (reached from three places)"

