journey_id: RET-32
slug: lapsed-customer-win-back
status: audited

story:
  trigger: "A formerly paying relationship is detected as lapsed, past the cancellation journey’s own save window and cooldown."
  entity: "A formerly paying relationship that lapsed with nothing open on it (person_id + relationship_id)."
  objective: "Win back a formerly paying relationship with a plain invitation that speaks to why they left where that is known, and never write to someone whose recorded reason or history says not to."
  success: "The relationship is repaid - a new paid term, a purchase, a reactivated subscription - inside the invitation’s window."
  summary: "A lapsed paying relationship is tested against the reasons policy says exclude outreach, then invited back with whatever honestly changed since they left, or plainly where nothing did. One optional follow-up is allowed where the company enables it and there is something honest to add; otherwise the person is left alone for the cooldown, and every non-send is recorded as a reason rather than a silence."
