journey_id: ACC-263
slug: entitlement-activation-window
status: audited

story:
  trigger: "An entitlement or credential is provisioned to a holder who is reachable."
  entity: "The issued entitlement or credential and its activation window."
  objective: "Get somebody to actually use what they have been granted before the window in which they can claim it closes - an unredeemed entitlement is indistinguishable from one that was never granted."
  success: "An authoritative first-use event is recorded inside the window (x.activated)."
  summary: "A new grant is announced in one of two registers - a full 'here is what this lets you do, here is the one first action' for a first-time holder, or a short 'here is only what changed' for someone who already uses the capability. The journey then waits for first use; if nothing happens and time remains in the window, exactly one reminder names the deadline and the same single action. There is no second reminder: the entitlement either gets used, is withdrawn before use, or lapses unclaimed."
  handoffs: []

