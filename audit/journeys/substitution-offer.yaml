journey_id: FUL-276
slug: substitution-offer
status: audited

story:
  trigger: "A substitution becomes required for part of an obligation and a specific alternative has been defined."
  entity: "The affected scope of the obligation and the single alternative offered against it."
  objective: "Put a defined alternative in front of the person the obligation was made to, with a real decline path and a stated deadline, so nothing different is ever supplied on the assumption they would not have minded."
  success: "The recipient explicitly accepts and the new promise is confirmed in its own terms (x.accepted). An explicit decline is a legitimate ending too - the obligation stays open and is never recorded as a cancellation."
  summary: "When something cannot be supplied as promised, the journey first checks that a permitted route reaches the recipient in time to decide - if not, it hands off rather than substituting silently. The offer names what cannot be supplied, the one alternative, the difference in plain terms, and equally reachable accept and decline paths with a closing date. One reminder follows, then the offer lapses with an explicit statement that nothing was substituted and the affected scope is still open."
  handoffs:
    - "CON-36 - a substitution offer that cannot be delivered on any permitted route before its window closes."

