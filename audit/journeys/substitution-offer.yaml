  - "Merge w.decision with c.answer into one wait-outcome card ('accepted' / 'declined'), with the timeout arm to the reminder as a separate labelled edge - P-WAITRES-01."
  - "Draw a.remind + w.final as one ladder step ('one reminder, then the offer closes') rather than two cards, with the closing date on the ladder - P-LADDER-01. w.final re-enters c.answer, so that re-entry is a labelled return arc into the merged wait-outcome card rather than a second copy of it - P-LOOP-01."
  - "Merge a.confirm-accept+x.accepted, a.confirm-decline+x.declined and a.lapse+x.lapsed into single ending cards - P-TERM-02. Note x.declined is class failure and x.lapsed class timeout: the merged cards must keep the class badge, since 'declined' and 'lapsed' leave the obligation in different states."
