planned_changes:
  - "Hide a.persist and a.persist-positive - storage bookkeeping that adds no step to the story - and hide a.classify and a.assess, whose whole content is the question the very next condition already asks."
  - "Merge a.attach into x.attached: an internal action with a single successor that is a suppression-class exit reads as one outcome, 'attached to the existing case'."
  - "Keep a.product visible even though it is execution:null - it is the only thing that happens on the PRODUCT_FEEDBACK branch and hiding it would make that branch look empty."
  - "Draw c.existing (dedupe), c.recognition and c.acknowledge (sendability) as inline gates; the six remaining conditions - c.route, c.actionable, c.severity, c.contribution, c.eligible, c.promise - are real business decisions and stay full size."
  - "h.issue, x.stored and x.closed each have two parents - local instance per parent."
  - "Six cards exceed the 110-char budget in both locales (a.persist 290, a.assess 269, a.classify 236); move the reasoning to the detail panel."
  - "At 60 display cards for 34 canonical nodes this is the largest comprehension failure in the slice: the routing spine must be readable before any leaf detail is."

