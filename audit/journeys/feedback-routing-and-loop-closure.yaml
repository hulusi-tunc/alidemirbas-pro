journey_id: FBK-43
slug: feedback-routing-and-loop-closure
status: audited

story:
  trigger: "Feedback arrives through any channel, attributable to a person and an experience, with enough substance to classify."
  entity: "The feedback record, linked to the person and the experience it is about - kept deliberately separate from any issue it produces."
  objective: "Get the feedback to the process that can act on it, and keep the record open until anything promised in return has actually happened."
  success: "The loop is closed: the feedback was routed to whoever owns it, and anything promised to the person was delivered - or nothing was owed and it is stored as such."
  summary: "Feedback is stored verbatim, classified into what it means operationally, and routed six ways - praise, service issue or complaint, support need, product feedback, general comment, or unclassifiable. Negative feedback is attached to an existing case or assessed for an actionable fault before anybody is acknowledged, and an actionable one goes to the issue journey at ordinary or escalated severity. The record stays open until any promised follow-up is delivered, and an undelivered promise is escalated rather than quietly closed."
  handoffs:
    - "FBK-42 - positive evidence reaching the advocacy threshold"
    - "external:advocacy-contribution - a reusable contribution offered voluntarily"
    - "FBK-46 - an actionable issue arising from feedback"
    - "DEC-181 - feedback that cannot be classified reliably"
    - "DEC-181 - a promised follow-up that did not happen"

