journey_id: TIM-274
slug: grace-period-recovery
status: audited

story:
  trigger: "A grace period starts - the entity's primary validity has ended and a bounded period with reduced function has begun."
  entity: "The entity whose primary validity ended, plus the fixed end of the grace period placed on it."
  objective: "Tell the holder that validity has lapsed into a bounded period, what still works, when that period ends and the one route back - so grace is a state they are in knowingly rather than one they discover when something stops."
  success: "The recovery condition is satisfied inside the window and the restoration is explicitly confirmed, naming which capabilities came back (x.recovered)."
  summary: "When grace begins, the holder is told either what has stopped working and what still does, or - where nothing they rely on has changed yet - that validity has lapsed and the date it will bite. The journey waits for recovery; if the window runs out, exactly one last call names the exact end date and the same single route back. It ends confirmed-recovered, mooted by early termination, or with a plain statement that the window has closed and what is no longer available."
  handoffs: []

