  - "Absorb a.read (execution:null, writes:[], sole successor c.next-step) into the c.next-step card - 'read what is done' is how that question is answered, not a separate step. Every edge that targeted a.read (two back edges) retargets to the condition - P-EVAL-01. This is the journey's only Internal card and its only >110-char card."
  - "Clamp the a.read lead sentence (159 chars as rendered) - P-DETAIL-03."
  - "Merge w.progress with c.what-happened into one wait-outcome card; the timeout arm into the window check stays a separate labelled edge - P-WAITRES-01."
  - "Draw the two back edges into the re-read (from the merged wait card, and from c.stalled-step's 'no blocker' arm) as labelled return arcs - P-LOOP-01. This loop is the journey's shape and must read as a loop, not as a line that falls off."
  - "Demote c.window ('is the onboarding window still open?') to a deadline chip on the stalled-progress path with one stub to x.window-closed; it is a timing gate rather than a business decision, but the window-closed ending must stay visible - P-GATE-01 / P-STATE-01 (c.window and c.stalled-step together answer one question: 'has this stalled for a reason, and is there still time?')."
  - "h.activated has two parents (c.ready and the merged wait card); keep per-parent handoff instancing - P-HANDOFF-01."
  - "Shorten the three long branch labels ('Setup complete, value not yet produced' 38 chars, and two 29-char labels) on the canvas - P-LABEL-01."

