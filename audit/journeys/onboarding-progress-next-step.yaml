journey_id: ACT-12
slug: onboarding-progress-next-step
status: audited

story:
  trigger: "An onboarding account is active but has not yet reached activation."
  entity: "The person or account plus the onboarding instance."
  objective: "Get an onboarding account to activation by surfacing the single most useful next step, read from what is actually done, until activation happens, a named blocker takes over, or the window closes."
  success: "The authoritative activation event is recorded and ownership passes to ACT-16 (h.activated)."
  summary: "The journey reads which setup milestones the product itself records as done, surfaces the single most useful outstanding step, and then waits. Each completed milestone re-reads the state and surfaces the next one; a checklist that is finished without value ever being produced keeps waiting rather than declaring success. When nothing moves, the journey distinguishes a genuinely blocking prerequisite - handed to a blocker journey - from a merely quiet interval, and stops when the onboarding window expires."
  handoffs:
    - "ACT-16 - the authoritative activation event."
    - "ACT-13 - one named mandatory prerequisite established as the thing preventing activation, rather than a general lack of progress."

classification:
  journey_types:
    - back-edge-retry
    - communication
    - handoff
    - multi-branch
    - nested-decision
    - no-deadline
    - nurture
    - shared-handoff
    - wait-event-timeout

