planned_changes:
  - "Merge a.state forward into c.authority (P-CHECK-01): the request bookkeeping and context read is the premise of 'does the requester hold authority', not a step before it."
  - "Merge a.verify forward into c.verified (P-CHECK-01) so 'did the closure take effect?' carries the verification rather than being preceded by a card that asks nothing."
  - "Keep a.execute drawn - it is the journey's central act and a merge point of two branches (c.blockers 'Permitted', c.recheck 'All clear'); centre it under both (P-MERGE-01)."
  - "Clamp a.state (185) and a.execute (230/242) to their first sentence, rationale to the detail panel (P-TEXT-01); move writes=closure_log and the wait's timeout_key to the panel (P-DETAIL-01)."
  - "Keep all four exits and both handoffs visible: authority refusal, unresolvable block, partial clearance, lapse, TRM-107 and OWN-55 are six materially different endings."

