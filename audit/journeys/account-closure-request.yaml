journey_id: TRM-106
slug: account-closure-request
status: audited

story:
  trigger: "Somebody asks for an account to be closed (account_closure_requested)."
  entity: "The account plus this specific closure request (account_id + closure_request_id, one active per key)."
  objective: "End the account relationship once the obligations that legitimately block it are resolved - and end nothing else: no subscription cancelled, no data deleted, no audit history erased."
  success: "Closure executed, verified as actually in effect, confirmed to the requester in writing (stating what closure is NOT), and handed to TRM-107 to settle dependent relationships."
  summary: "A closure request is checked for authority, then for blockers. With no blocker it is executed, verified and confirmed; with a resolvable blocker the exact blocker is named and the journey waits for it to clear, rechecking whether anything else remains; with an unresolvable one the requester is told plainly. A closure that did not fully apply escalates rather than being reported as done."
  handoffs:
    - "TRM-107 - dependent relationships, once closure has taken effect on the account itself"
    - "OWN-55 - a closure that did not fully apply (account still active somewhere)"

classification:
  journey_types:
    - back-edge-retry
    - communication
    - communication-heavy
    - handoff
    - multi-branch
    - nested-decision
    - no-deadline
    - wait-event-timeout

display_audit:
  display_node_count_before: 33
  unnecessary_internal_nodes: 2      # a.state (request bookkeeping + context read), a.verify (post-execute check)
  technical_conditions_groupable: 1  # c.verified - a verification gate, not a business choice
  router_message_collapsible: false  # no channelPriority router node anywhere in this journey
  shared_terminal_candidate: false   # every exit/handoff has exactly one parent
  long_text_present: true            # a.state 185, a.execute 230 (EN); a.execute 242 (TR)
  locale_issue: false
  unknown_node_types: []
  needed_visual_nodes: 17

