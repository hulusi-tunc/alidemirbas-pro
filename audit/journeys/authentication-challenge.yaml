  - "Draw c.sufficient as an inline pre-send gate with an 'already authenticated' outcome chip; it is a state check before the only send, not a business fork."
  - "Shorten 'Authenticated at the required level' / 'Authenticated below the required level' to two short labels that still read as different outcomes - this three-way split is the real decision and must stay visible."

