journey_id: IDN-85
slug: authentication-challenge
status: audited

story:
  trigger: "A context requires proof that whoever is present actually controls the identity being claimed."
  entity: "The authentication session, bound to one actor and one account, carrying an explicit assurance level and an explicit validity."
  objective: "Establish control of the identity at the assurance level this particular context demands - no more, no less."
  success: "Control is established at the required level and a session is issued with a stated assurance and a stated validity; or an existing session already meets the level and nothing is challenged."
  summary: "When something needs the actor's identity proven, the journey works out what assurance that context demands and skips the challenge entirely if the current session already meets it. Otherwise it issues one challenge and waits: success at the required level issues the session, success below it goes to step-up, failure goes to the failure journey, and an unanswered challenge is recorded as nothing at all rather than as a failed attempt."
  handoffs:
    - "IDN-86 - control established below the assurance the context requires (step-up)"
    - "IDN-87 - an authentication failure"

classification:
  journey_types:
    - communication
    - handoff
    - multi-branch
    - no-deadline
    - wait-event-timeout

