planned_changes:
  - "c.worth-it already collapses under the existing gate rule, and this journey is the warning case for it: the absorbed question contains a real business qualifier ('a specific reason exists'), so P-GATE-01 must print the absorbed question in the detail of the card it collapses into, not drop it."
  - "Absorb a.reason and a.inspect into the conditions they feed (P-CLASSIFY-01); both are over 110 chars and both restate the following question."
  - "Shorten 'Signal did not survive inspection' (33) and 'Renewed commercial intent' (25) branch labels (P-LABEL-01)."
  - "c.state's four arms are four different owners - they are the journey and must stay four separate visible paths."

