journey_id: SCH-266
slug: appointment-readiness-reminder
status: audited

story:
  trigger: "A confirmed booking occurrence is approaching and the customer still owes prerequisites against it."
  entity: "One confirmed booking occurrence plus the prerequisites its customer owes (booking_id + occurrence_id)."
  objective: "Get the customer’s side of a confirmed commitment done before it arrives, and remind them from what the booking is at the moment of sending."
  success: "One reminder, built from freshly re-read booking state, hands the occurrence to pre-service revalidation (SCH-177) with the customer ready."
  summary: "Where time remains, every outstanding prerequisite is named in one message; the booking is then re-read from authoritative state before anything is sent. A still-valid booking with a blocking prerequisite gets an at-risk notice and goes to SCH-174, a clean one gets the reminder and goes to SCH-177, and a booking that was cancelled or moved in the meantime is superseded and nothing is sent."
  handoffs:
    - "SCH-174 - a booking reaching pre-start with a critical prerequisite still outstanding"
    - "SCH-177 - a reminded, revalidated booking; start window and attendance belong to pre-service revalidation"

