journey_id: RSK-273
slug: usage-limit-capacity-path
status: audited

story:
  trigger: "An authoritative usage figure reaches a defined limit in its measurement window and an action is actually blocked or held by it."
  entity: "The entity and the one limit constraining it, in one measurement window - one limit, one window, one authoritative count."
  objective: "Meet somebody at the moment a limit stops them with the three facts that decide what happens next: what the limit is, when it resets, and whether more capacity can be bought - without any of it reading as an accusation."
  success: "The window resets or capacity is authorised, and the held action can proceed."
  summary: "At the point the action is stopped, the journey states which limit was reached and when the window resets, then establishes what path exists - purchasable capacity, an automatic reset, or neither. Where capacity can be bought it matters who holds that decision: the person who hit the limit is offered it directly, or the party who holds it is told what is blocked and for whom while the blocked person is told who they are waiting on. Authorised capacity is executed as a plan change; a reset is announced from the authoritative reset point."
  handoffs:
    - "SUB-166 - an authorised capacity increase that has to be executed as a change of plan or terms"

