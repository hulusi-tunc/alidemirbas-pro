journey_id: ACT-17
slug: early-adoption-to-stable-use
status: audited

story:
  trigger: "An account completed core activation for the first time (core_activation_completed)."
  entity: "The person or account, plus the product or use-case the value comes from."
  objective: "Turn one activation into value produced repeatedly in the same use-case: recognise what was actually produced, name the one behaviour that would produce more, and stop as soon as adoption is stable or has stalled."
  success: "h.normal -> external:customer-lifecycle, adoption stabilising - value produced repeatedly at the rhythm the use-case implies, without prompting."
  summary: "After a first activation the journey acknowledges what was actually produced and, where one genuinely follows, surfaces a single next action. It then reads adoption from value-producing usage: stable adoption hands the account back to the ordinary lifecycle, unstable adoption gets one behaviour nudge and an observation window, and a window that closes without repeated value hands off to the stall journey."
  handoffs:
    - "h.normal -> external:customer-lifecycle, on adoption stabilising."
    - "h.stall -> ACT-18, on the early-adoption window passing without repeated value."

