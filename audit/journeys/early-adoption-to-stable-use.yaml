planned_changes:
  - "P-READ-01: a.measure is the only execution:null node and the only long card (245 chars EN / 256 TR). It has a single edge into c.stable and does nothing but read adoption, so it should fold into that decision - 'Has adoption become stable?' with a reads caption, full prose in the panel. That alone takes the journey from 2 measured Internal cards to none and removes all long text."
  - "P-LOOP-01: a.measure has three parents (c.next 'No', a.surface, and w.observe's event arm), one of which is a back edge from the wait. After the fold, c.stable inherits those three parents - the loop edge from w.observe must stay drawn and stay labelled 'value produced', or the journey reads as linear when it is a cycle."
  - "P-MERGE-01: that same three-parent inheritance is a centred merge, not a chain under one parent."
  - "All 9 remaining nodes are business content: two communications, one behaviour nudge, one observation window, two real decisions and two handoffs. This is one of the cleanest journeys in the slice once the single read node is folded."

