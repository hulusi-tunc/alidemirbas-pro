severity:
  highest: P1

planned_changes:
  - "Four binary conditions in a row, each with a bail-out to a different ending, then one message: this is the P-GAUNTLET-01 shape. Draw them as one compact pre-check spine with the four bail-outs as small exits beside it, not four full-width decision cards down the canvas."
  - "Only c.duplicate is a pure implementation gate; the other three carry business rules the reader needs, so a rule that hides a whole chain of binary conditions would be wrong here - the spine keeps them, it just stops them dominating the drawing."
  - "a.assess needs no box (P-CLASSIFY-01/P-SETUP-01): its prose is the list of questions the spine then asks."
  - "x.silent is class no-action but is a real ending ('resolved without contact'); the gate rule must not absorb it, since it is not the short arm of a binary permission gate."

canonical_logic:
  mutation_required: false

