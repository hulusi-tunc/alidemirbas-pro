journey_id: RET-26
slug: negative-experience-recovery
status: audited

story:
  trigger: "An authoritative record of a negative experience or service failure attributable to a person and an experience entity."
  entity: "Person or account plus the experience or service entity that failed. The recovery belongs to the failure - a second unrelated failure is a second instance."
  objective: "Say what failed, what was done and what prevents it recurring - once, only when it is useful, only after the failure is resolved, and only where no other process already owns it."
  success: "x.acknowledged - the failure is acknowledged with an account of what happened, and no remedy was owed (which is most failures)."
  summary: "Before anything is said, the journey establishes what failed and who already owns it: an open case defers it, an unresolved failure belongs to operations, a failure the customer never noticed stays silent, and a failure that policy says is owed a remedy goes to the remedy journey. What is left gets one honest acknowledgement with no discount standing in for an explanation."
  non_success_endings:
    - "x.defer (suppression): another recovery process already covers the same incident"
    - "x.silent (no-action): the failure was resolved before it reached the customer - raising it would create the concern it apologises for"
  handoffs:
    - "h.operational -> external:operational-resolution while the failure is still ongoing"
    - "h.compensation -> REM-159 when policy and impact both support a remedy"
  business_decisions:
    - "c.resolved - is the underlying issue still unresolved (the operational owner keeps it until it is fixed)"
    - "c.useful - is a recovery communication actually useful to this person"
    - "c.compensation - do policy and actual impact support compensation (the boundary with the remedy journey)"
  implementation_checks:
    - "c.duplicate - a dedupe check ('is another recovery process already handling this failure?')"
  bookkeeping_nodes:
    - "a.assess - establishes what failed, what it cost, whether it is resolved, whether they are still affected, and whether anyone else has it: a 179-char preamble that enumerates exactly the four conditions that follow it"
  read_as_one_action:
    - "a.assess + the c.duplicate/c.resolved/c.useful/c.compensation chain as one 'is a recovery message appropriate, and is a remedy owed?' qualification spine"
  must_stay_visible:
    - "x.defer and x.silent - both are deliberate silences with different reasons and both are the journey's real behaviour"
    - "h.operational"
    - "h.compensation -> REM-159"
    - "x.acknowledged"

classification:
  journey_types:
    - communication
    - external-handoff
    - handoff
    - multi-branch
    - nested-decision

