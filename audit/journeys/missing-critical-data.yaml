journey_id: FBK-49
slug: missing-critical-data
status: audited

story:
  trigger: "A named business process cannot safely proceed because one specific field, document or value is missing."
  entity: "The blocked business entity plus the specific missing requirement - one instance per gap per blocked process."
  objective: "Treat a genuinely blocking data gap as a named dependency and close it, keeping it distinct from wanting to know more about someone."
  success: "The requirement is satisfied by a valid value and the blocked process is free to continue."
  summary: "When a process is blocked on a specific missing item, the journey first checks whether an authoritative system already holds it - asking for what we already have is its own failure. If it has to be provided, it goes to whoever can actually supply it: the customer on a customer channel, or an internal owner as owned work. What arrives is validated; if it never arrives or does not satisfy the requirement, the criticality of the blocked process decides between escalating to a person, taking an alternate route, or recording the process as blocked."
  handoffs:
    - "external:human-in-the-loop-lifecycle - a critical dependency that requesting did not resolve"

classification:
  journey_types:
    - communication
    - external-handoff
    - handoff
    - human-vs-automated
    - multi-branch
    - nested-decision
    - no-deadline
    - recovery
    - wait-event-timeout

