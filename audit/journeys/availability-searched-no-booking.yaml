planned_changes:
  - "c.permitted already collapses under the existing no-action gate rule; keep it and put 'no reachable person' in the trigger card's detail."
  - "Fold c.settled into w.settle (P-WAITARM-01): its two branches are exactly w.settle's two until-events (booking_confirmed, availability_lost)."
  - "a.recheck should not have its own box; its rule ('what was shown was never held') is the reason the c.options card exists and belongs in that card's detail."
  - "Three branch labels run 25-29 chars ('Nothing fits, waitlist exists'); shorten to 'Waitlist' / 'Nothing to offer' / 'Near window' with the full condition in the detail (P-LABEL-01)."
  - "a.recheck and w.settle's timeout arm both reach c.options - draw that as a centred merge, not two lanes (P-MERGE-01)."

