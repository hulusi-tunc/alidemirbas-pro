journey_id: SCH-282
slug: availability-searched-no-booking
status: audited

story:
  trigger: "An availability query closed without any reservation or hold being created from it."
  entity: "The availability question itself - the resource and window it asked about - and the absence of any reservation from it."
  objective: "Follow the question up once with something that is genuinely bookable now, or with a waitlist place, because what was shown at query time was never held."
  success: "A booking is confirmed (x.booked, reached both unprompted and after the offer) or a waitlist place is taken (x.waitlisted, which reserves nothing and says so)."
  summary: "Someone asked what was free and booked nothing. After a bounded delay the journey re-reads real availability rather than reusing the query result, then offers the nearest bookable window, a waitlist place, or nothing at all. One offer per query."
  non_success_endings:
    - "x.no-route (no-action): the query cannot be attributed to a person who may be contacted for this purpose"
    - "x.nothing (no-action): nothing fits and there is no waitlist to put the person on"
    - "x.lapsed (timeout): the offer or the waitlist place was made and not taken"
  handoffs:
    []
  business_decisions:
    - "c.settled - what ended the delay: they booked it themselves, or the window went"
    - "c.options - what is actually available now: a near window / a waitlist / nothing (the three real outcomes of the re-read)"
  implementation_checks:
    - "c.permitted - 'may an unprompted offer be sent to this person at all?'; anonymous or unpermitted is a recorded no-action, not a branch of the story"
  bookkeeping_nodes:
    - "a.recheck - 're-evaluate what is genuinely bookable now' is the question c.options then asks; 226-char EN / 292-char TR card"
  read_as_one_action:
    - "a.recheck + c.options as one 'what is bookable now?' decision"
    - "a.offer with w.respond, and a.waitlist with w.waitlist, each as one 'offer and wait' step"
  must_stay_visible:
    - "x.booked (success, reachable two ways - one instance per parent)"
    - "x.waitlisted"
    - "x.nothing"
    - "x.lapsed"

classification:
  journey_types:
    - back-edge-retry
    - communication
    - multi-branch
    - no-deadline
    - shared-exit
    - wait-event-timeout

display_audit:
  display_node_count_before: 19
  unnecessary_internal_nodes: 1
  technical_conditions_groupable: 1
  router_message_collapsible: false
  shared_terminal_candidate: true
  long_text_present: true
  locale_issue: false
  unknown_node_types: []
  needed_visual_nodes: 12

